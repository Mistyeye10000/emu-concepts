<!doctype html>
<!-- CONCEPT 8: READ, THEN BOOK, profile. Plan is in c8-home.html.
     One reading column, like an article about Jordan. A quiet bar stays at the bottom; "Check times"
     opens booking as a drawer (Fiverr) with four real steps (Walmart's step bar): Place, Time, Your
     details, Sent. The reading never moves while you book. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 8 profile</title>
<script src="data.js?v=8"></script>
<script src="kit.js?v=8"></script>
<script src="map.js?v=8"></script>
<script src="request.js?v=8"></script>
<script>document.write(`<link rel="stylesheet" href="${EMU.brand.fontsHref}">`)</script>
<style>
  html { scrollbar-gutter: stable; }
  :root { --ink: #291605; --soft: #675D55; --line: #E3E0DD; --dusk: #2C4A66; --dusk-50: #E9EFF5; --rust: #9B5212; --rust-d: #6E3A0D; --error: #B42318;
    --serif: 'Newsreader', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #fff; color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; padding-bottom: 96px; }
  a { color: var(--dusk); }
  :focus-visible { outline: 3px solid var(--rust); outline-offset: 2px; }
  .ic { width: 18px; height: 18px; flex: none; }
  .wrap { max-width: 1080px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 768px) { .wrap { padding: 0 40px; } }
  header.top .wrap { display: flex; justify-content: space-between; align-items: center; min-height: 72px; }
  .logo { font: 400 30px/1 var(--serif); text-decoration: none; color: var(--ink); }
  nav a { text-decoration: none; font-weight: 500; padding: 12px; color: var(--ink); }

  .art { max-width: 700px; margin: 0 auto; padding: 0 0 40px; }
  .back { display: inline-flex; align-items: center; gap: 4px; min-height: 44px; font-weight: 500; text-decoration: none; }
  h1 { font: 400 clamp(48px, 8vw, 92px)/.98 var(--serif); letter-spacing: -0.03em; margin: 28px 0 0; }
  .stand { font: 400 clamp(21px, 2.6vw, 26px)/1.45 var(--serif); color: var(--soft); margin: 18px 0 0; }
  .ver { display: inline-flex; gap: 6px; align-items: center; font-size: 15px; font-weight: 600; color: var(--dusk); margin-top: 14px; }
  .portrait { margin: 36px 0 8px; display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 24px; align-items: end; }
  .portrait img { width: 160px; height: 200px; object-fit: cover; border-radius: 4px; }
  .portrait p { margin: 0; font-size: 15px; color: var(--soft); }
  @media (max-width: 560px) { .portrait { grid-template-columns: 112px minmax(0, 1fr); } .portrait img { width: 112px; height: 140px; } }
  .art h2 { font: 400 32px/1.15 var(--serif); margin: 48px 0 12px; letter-spacing: -0.01em; }
  .art p.body { font: 400 20px/1.65 var(--serif); margin: 0; }
  .art .focus { font: 400 20px/1.6 var(--serif); margin: 0; }
  .methods dt { font: 600 17px var(--sans); margin-top: 16px; }
  .methods dd { margin: 4px 0 0; font: 400 19px/1.6 var(--serif); color: var(--soft); }
  .pull { margin: 40px 0; padding: 0 0 0 24px; border-left: 3px solid var(--dusk); font: 400 clamp(26px, 3.4vw, 34px)/1.3 var(--serif); }
  .pull figcaption { font: 400 15px var(--sans); color: var(--soft); margin-top: 10px; }
  .pull p { margin: 0; }

  /* The quiet bar */
  .bar { position: fixed; left: 0; right: 0; bottom: 0; z-index: 20; background: var(--dusk-50); border-top: 1px solid rgba(44,74,102,.2); }
  .bar .wrap { display: flex; align-items: center; gap: 12px 20px; min-height: 76px; flex-wrap: wrap; padding-top: 10px; padding-bottom: 10px; }
  .bar img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .bar .who { font-weight: 600; }
  .bar .who span { display: block; font-weight: 400; font-size: 14px; color: var(--soft); }
  .btn { font: 600 16px var(--sans); min-height: 48px; padding: 0 24px; border: 0; border-radius: 99px; background: var(--rust); color: #fff; cursor: pointer; }
  .btn:hover { background: var(--rust-d); }
  .bar .btn { margin-left: auto; }
  .btn2 { font: 600 16px var(--sans); min-height: 48px; padding: 0 20px; border: 1.5px solid var(--dusk); border-radius: 99px; background: #fff; color: var(--dusk); cursor: pointer; }

  /* The drawer */
  dialog.drawer { border: 0; padding: 0; margin: 0 0 0 auto; height: 100dvh; max-height: 100dvh; width: min(500px, 100vw); max-width: 100vw; color: var(--ink); background: #fff; box-shadow: -20px 0 60px -30px rgba(41,22,5,.5); }
  dialog.drawer::backdrop { background: rgba(41,22,5,.35); }
  .dr { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100%; }
  .dr header { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 20px; background: var(--dusk-50); }
  .dr header h2 { margin: 0; font: 400 26px/1.2 var(--serif); }
  .xb { width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: inherit; }
  .xb:hover { background: #fff; }
  ol.steps { list-style: none; margin: 0; padding: 14px 20px; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; border-bottom: 1px solid var(--line); counter-reset: s; }
  .steps li { counter-increment: s; font-size: 13px; color: var(--soft); display: grid; gap: 6px; }
  .steps li::before { content: counter(s); width: 28px; height: 28px; border-radius: 50%; border: 1.5px solid #877A6E; display: grid; place-items: center; font: 600 13px var(--sans); }
  .steps li[aria-current="step"] { color: var(--ink); font-weight: 600; }
  .steps li[aria-current="step"]::before { border-color: var(--dusk); background: var(--dusk); color: #fff; }
  .steps li.done::before { content: "✓"; border-color: var(--dusk); color: var(--dusk); }
  .pane { overflow-y: auto; padding: 18px 20px 24px; }
  .pane h3 { font: 400 24px/1.25 var(--serif); margin: 0 0 4px; }
  .pane .lead { margin: 0 0 14px; color: var(--soft); }
  .dayblk + .dayblk { margin-top: 14px; }
  .dayblk h4 { margin: 0 0 6px; font: 600 15px var(--sans); }
  .per { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: start; }
  .per + .per { margin-top: 6px; }
  .per > span { font-size: 14px; color: var(--soft); padding-top: 9px; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; }
  .slot { font: 500 15px var(--sans); font-variant-numeric: tabular-nums; min-height: 40px; padding: 0 12px; border: 1px solid #877A6E; border-radius: 99px; background: #fff; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .slot .ic { width: 14px; height: 14px; display: none; }
  .slot:hover { border-color: var(--dusk); }
  .slot[aria-pressed="true"] { background: var(--dusk); border-color: var(--dusk); color: #fff; font-weight: 600; }
  .slot[aria-pressed="true"] .ic { display: inline; }
  .nowork { margin-top: 20px; padding-top: 14px; border-top: 1px solid var(--line); }
  .nowork p { margin: 0 0 8px; font-weight: 600; }
  .dr footer { padding: 14px 20px; border-top: 1px solid var(--line); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
  .dr footer .sum { flex: 1 1 100%; margin: 0; font-weight: 600; }
  .dr footer .sum.is-error { color: var(--error); }
  .dr footer .btn { margin-left: auto; }
  .sentbox { background: var(--dusk-50); border-radius: 6px; padding: 16px; margin: 0 0 16px; }
  .sentbox p { margin: 0; }
  .sentbox b { display: block; font: 400 22px/1.3 var(--serif); margin-bottom: 4px; }

  :root { --x-accent: var(--dusk); --x-tint: var(--dusk-50); --x-line: var(--line); --x-r: 6px; --x-pin: #2C4A66; --x-pin-on: #9B5212; }
  .exm { color: var(--dusk); font-weight: 700; margin-left: 2px; }
  .x-facts { margin: 0; }
  .x-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--x-line); }
  .x-row dt { font-weight: 600; color: var(--soft); }
  .x-row dd { margin: 0; font: 400 19px/1.5 var(--serif); }
  .x-call { background: var(--dusk-50); border-radius: 6px; padding: 14px 16px; display: grid; gap: 2px; margin: 0 0 16px; }
  .x-call b { color: var(--dusk); font-weight: 600; }
  .x-call span { font-size: 14px; color: var(--soft); }
  .x-notice { margin: 0 0 14px; font-size: 15px; color: var(--soft); }
  .x-h { font-weight: 600; font-size: 15px; margin: 0 0 6px; }
  .x-next ol { margin: 0; padding-left: 20px; color: var(--soft); }
  .x-ask { font: 600 15px var(--sans); min-height: 44px; width: 100%; padding: 0 14px; border: 1.5px dashed #877A6E; background: transparent; border-radius: 99px; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .x-prop { font-size: 12px; font-weight: 600; color: var(--soft); border: 1px solid #877A6E; border-radius: 99px; padding: 1px 7px; }
  .x-note { font-size: 14px; color: var(--soft); margin: 6px 0 0; }
  .x-place { margin-top: 10px; display: grid; gap: 6px; }
  .x-place p { margin: 0; }
  .x-legend { font-size: 14px; color: var(--soft); margin: 40px 0 0; }
  .x-foot { max-width: 700px; margin: 0 auto; padding: 28px 16px 24px; border-top: 1px solid var(--line); font-size: 14px; color: var(--soft); }
  .x-foot p { margin: 0 0 8px; }
  .x-crisis { color: var(--ink) !important; font-weight: 600; }
  .x-map { height: 300px; border-radius: 6px; overflow: hidden; position: relative; z-index: 0; background: var(--dusk-50); margin-top: 20px; }
  .x-loclist { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
  .x-locitem { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 14px; padding: 14px 0; border-top: 1px solid var(--line); }
  .x-num { width: 28px; height: 28px; border-radius: 50%; background: var(--x-pin); color: #fff; display: grid; place-items: center; font: 700 13px var(--sans); }
  .x-locname { margin: 0; font: 400 22px/1.3 var(--serif); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; }
  .x-tag { font: 600 12px var(--sans); color: var(--dusk); border: 1px solid currentColor; border-radius: 99px; padding: 1px 8px; }
  .x-addr { margin: 2px 0 0; font-size: 15px; color: var(--soft); }
  .x-instr { margin: 6px 0 0; font: 400 19px/1.5 var(--serif); }
  .x-picker .x-h { display: none; }
  .x-locs { display: grid; gap: 8px; }
  .x-loc { font: inherit; text-align: left; display: grid; grid-template-columns: 16px 24px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 60px; padding: 10px 14px; border: 1px solid #877A6E; border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; }
  .x-loc small { display: block; font-size: 13px; color: var(--soft); font-weight: 400; }
  .x-loc .x-tick { visibility: hidden; width: 16px; height: 16px; color: var(--dusk); }
  .x-loc .x-n { width: 24px; height: 24px; border-radius: 50%; background: var(--x-pin); color: #fff; display: grid; place-items: center; font: 700 12px var(--sans); }
  .x-loc[aria-pressed="true"] { border: 2px solid var(--dusk); background: var(--dusk-50); font-weight: 600; }
  .x-loc[aria-pressed="true"] .x-tick { visibility: visible; }
  .x-hint-line, .x-none { font-size: 14px; color: var(--soft); margin: 8px 0 0; }
  .x-moredates { color: var(--dusk); }
  :root { --rq-ink:#291605;--rq-soft:#675D55;--rq-panel:#E9EFF5;--rq-line:#E3E0DD;--rq-accent:#9B5212;--rq-accent-hover:#6E3A0D;--rq-radius:8px;--rq-btn-radius:99px;--rq-title-font:400 28px/1.15 'Newsreader',Georgia,serif;--rq-sans:'Inter',system-ui,sans-serif; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="c8-home.html">emu.</a><nav aria-label="Main"><a href="c8-directory.html">Find a therapist</a><a href="#">For therapists</a></nav></div></header>
<main class="wrap"><article class="art" id="art"></article></main>

<div class="bar" role="region" aria-label="Book with Jordan"><div class="wrap" id="bar"></div></div>

<dialog class="drawer" id="drawer" aria-labelledby="dr-t">
  <div class="dr" id="dr">
    <header><h2 id="dr-t">Book with Jordan</h2><button class="xb" id="drx" aria-label="Close booking"></button></header>
    <ol class="steps" id="steps"><li data-s="1">Place</li><li data-s="2">Time</li><li data-s="3">Your details</li><li data-s="4">Sent</li></ol>
    <div class="pane" id="pane"></div>
    <footer id="dfoot"></footer>
  </div>
</dialog>

<script>
  const { icon, mockBar, fullSlot, facts, freeCall, whatNext, contact, legend, notice, payLine, crisisFoot, locList, locPicker, wireLocs, mountLocMap, exm } = KIT;
  mockBar(8, 'Read, then book');
  const j = EMU.therapists[0], P = EMU.profile, X = EMU.extras, L0 = P.locations[0];

  document.getElementById('art').innerHTML = `
    <a class="back" href="c8-directory.html">${icon('left')}Back to your search</a>
    <h1>${j.name}</h1>
    <p class="stand">${j.credential} in ${j.city}, meeting clients at ${L0.name} and two other places in the city.</p>
    <span class="ver">${icon('badge')}License verified in ${j.state}</span>
    <div class="portrait"><img src="${j.photo}" alt="Portrait of ${j.name}"><p>$${j.price} per session. ${X.payment.text}</p></div>
    <h2>About me</h2><p class="body">${P.about}</p>
    <h2>${EMU.labels.focus}</h2><p class="focus">${j.specialties.join(', ')}</p>
    <h2>What you can expect</h2><p class="body">${P.expect}</p>
    <figure class="pull"><p>${L0.instructions}</p><figcaption>Jordan's meeting instructions for ${L0.name}.</figcaption></figure>
    <h2>Where you'll meet</h2>${locList()}
    <div class="x-map" id="locmap" role="region" aria-label="Map of Jordan's three meeting places, numbered to match the list"></div>
    <h2>${EMU.labels.approaches}</h2><dl class="methods">${P.methods.map(([n, d]) => `<dt>${n}</dt><dd>${d}</dd>`).join('')}</dl>
    <h2>Good to know</h2>${facts()}
    ${legend()}`;
  mountLocMap(document.getElementById('locmap'));
  document.querySelector('main').insertAdjacentHTML('afterend', crisisFoot());

  document.getElementById('bar').innerHTML = `<img src="${j.photo}" alt=""><p class="who" style="margin:0">${j.name}<span>$${j.price} per session. ${X.notice.text}</span></p><button class="btn" id="check">Check times</button>`;

  // Drawer with four steps
  const drawer = document.getElementById('drawer'), pane = document.getElementById('pane'), dfoot = document.getElementById('dfoot');
  document.getElementById('drx').innerHTML = icon('x');
  document.getElementById('drx').onclick = () => drawer.close();
  drawer.addEventListener('click', e => { if (e.target === drawer) drawer.close(); });
  const slot = (d, t) => `<button class="slot" aria-pressed="false" data-t="${fullSlot(d, t)}">${icon('check')}${t}</button>`;
  const per = (lab, d, ts) => ts.length ? `<div class="per"><span>${lab}</span><div class="slots" role="group" aria-label="${d}, ${lab.toLowerCase()}">${ts.map(t => slot(d, t)).join('')}</div></div>` : '';
  const daysHTML = av => av.map(d => `<div class="dayblk"><h4>${d.day}</h4>${per('Morning', d.day, d.morning)}${per('Afternoon', d.day, d.afternoon)}</div>`).join('');

  // Both pickers live in the drawer from the start so the shared location wiring can drive them
  pane.innerHTML = `
    <section data-p="1"><h3>Where would you like to meet?</h3><p class="lead">Jordan meets at three places. Times depend on the place.</p>${freeCall()}${locPicker()}</section>
    <section data-p="2" hidden><h3 id="h-time"></h3>${notice()}<div data-days></div>
      <div class="nowork"><p>None of these times work?</p>${contact()}</div></section>
    <section data-p="3" hidden><h3>Your details</h3><p class="lead">Fill in the request form to send it. If you closed it, open it again below.</p></section>
    <section data-p="4" hidden><div class="sentbox"><b>Request sent</b><p id="sentline"></p></div>${whatNext()}<p class="lead" style="margin-top:14px">${payLine()}</p></section>`;
  const root = drawer;
  let step = 1, picked = null;
  root.__resetPick = () => { picked = null; };
  wireLocs(root, daysHTML);
  const loc = () => P.locations.find(l => l.name === root.dataset.loc);

  function go(n) {
    step = n;
    pane.querySelectorAll('section').forEach(s => s.hidden = +s.dataset.p !== n);
    document.querySelectorAll('#steps li').forEach(li => { const s = +li.dataset.s; li.classList.toggle('done', s < n); if (s === n) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
    if (n === 2) document.getElementById('h-time').textContent = `Times at ${root.dataset.loc}`;
    dfoot.innerHTML = n === 1 ? `<p class="sum">${root.dataset.loc}</p><button class="btn" id="next">Choose a time</button>`
      : n === 2 ? `<p class="sum" aria-live="polite">${picked ? picked : 'No time chosen yet'}</p><button class="btn2" id="prev">Back</button><button class="btn" id="next">Continue</button>`
      : n === 3 ? `<p class="sum">${picked} at ${root.dataset.loc}</p><button class="btn2" id="prev">Back</button><button class="btn" id="next">Open the request form</button>`
      : `<button class="btn" id="done">Done</button>`;
    pane.scrollTop = 0;
    const first = pane.querySelector(`section[data-p="${n}"] h3`); if (first) { first.tabIndex = -1; first.focus(); }
  }
  const openForm = () => EMU_REQ.open({ therapist: j, when: picked, place: root.dataset.loc, address: loc().address, onDone: () => sent(`${picked} at ${root.dataset.loc}`) });
  function sent(what) { document.getElementById('sentline').textContent = `${what}. Jordan will reply by email. Your appointment is confirmed only when Jordan accepts.`; go(4); }
  dfoot.addEventListener('click', e => {
    if (e.target.id === 'prev') go(step - 1);
    if (e.target.id === 'done') drawer.close();
    if (e.target.id !== 'next') return;
    if (step === 1) go(2);
    else if (step === 2) { if (!picked) { const s = dfoot.querySelector('.sum'); s.textContent = 'Choose a time to continue'; s.classList.add('is-error'); pane.querySelector('.slot')?.focus(); return; } go(3); openForm(); }
    else if (step === 3) openForm();
  });
  pane.addEventListener('click', e => {
    const s = e.target.closest('[data-t]'); if (!s) return;
    pane.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', x === s));
    picked = s.dataset.t; const sum = dfoot.querySelector('.sum'); sum.textContent = picked; sum.classList.remove('is-error');
  });
  root.addEventListener('click', e => { if (e.target.closest('.x-loc') && step === 1) dfoot.querySelector('.sum').textContent = root.dataset.loc; });
  // "See more available dates" (shared) finishes the request itself; follow it to step 4
  pane.addEventListener('click', e => {
    if (!e.target.closest('.x-moredates')) return;
    const d = document.querySelector('dialog.rq'); if (!d) return;
    const obs = new MutationObserver(() => { const h = d.querySelector('h2'); if (h && h.textContent === EMU.request.sentTitle) { const sum = d.querySelector('.rq-sum span:last-child'); obs.disconnect(); sent(`${sum ? sum.textContent.replace(/ \(Eastern Time\)$/, '') : 'Your chosen time'} at ${root.dataset.loc}`); } });
    obs.observe(d, { childList: true, subtree: true });
  });
  const open = () => { go(1); drawer.showModal(); };
  document.getElementById('check').onclick = open;
  if (new URLSearchParams(location.search).get('book')) open();
</script>
</body>
</html>
