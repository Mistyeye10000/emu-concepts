<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 3 directory</title>
<script src="data.js?v=8"></script>
<script src="kit.js?v=8"></script>
<script src="map.js?v=8"></script>
<script>document.write(`<link rel="stylesheet" href="${EMU.brand.fontsHref}">`)</script>
<style>
  html { scrollbar-gutter: stable; }
  :root {
    --ink: #291605; --ink-2: #70655C; --rule: #E7E3EC; --cream: #FCFAF8;
    --rust: #9B5212; --rust-d: #6E3A0D; --rust-8: #6E3A0D;
    --lilac: #EFD2F9; --lilac-50: #FAF1FD; --lilac-1: #F6E4FC; --lilac-7: #6A307E; --lilac-8: #4B2259;
    --sky: #EAF1F8; --sky-8: #22405C; --peach: #FBE6D8;
    --serif: 'Newsreader', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
    --r: 22px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .ic { width: 18px; height: 18px; flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 768px) { .wrap { padding: 0 32px; } }

  header.top { position: sticky; top: 0; z-index: 10; background: rgba(255,255,255,.92); backdrop-filter: blur(10px) saturate(1.3); border-bottom: 1px solid var(--rule); }
  header.top .wrap { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 16px; align-items: center; min-height: 76px; }
  .logo { font: 700 22px/1 var(--sans); letter-spacing: -0.03em; text-decoration: none; }
  nav a { text-decoration: none; font-weight: 500; font-size: 16px; padding: 10px 12px; border-radius: 99px; }
  nav a:hover { background: var(--sky); }
  @media (max-width: 700px) { header.top nav { display: none; } header.top .wrap { grid-template-columns: auto minmax(0, 1fr); } }

  .pill { justify-self: center; width: min(100%, 560px); display: grid; grid-template-columns: minmax(0, 1.2fr) auto minmax(0, 1fr) auto; align-items: center; gap: 4px; padding: 6px 6px 6px 8px; border-radius: 99px; border: 1px solid var(--rule); background: #fff; box-shadow: 0 2px 10px -2px rgba(34,64,92,.14); }
  .pill .f { display: grid; padding: 2px 14px; border-radius: 99px; min-width: 0; }
  .pill .f:hover { background: var(--sky); }
  .pill label { font: 600 13px/1.2 var(--sans); color: var(--sky-8); }
  .pill input, .pill select { font: 500 16px var(--sans); color: var(--ink); border: 0; background: transparent; padding: 0; min-width: 0; width: 100%; }
  .pill .div { width: 1px; height: 28px; background: var(--rule); }
  .pill .go { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--rust); color: #fff; display: grid; place-items: center; cursor: pointer; }
  .pill .go:hover { background: var(--rust-d); }
  @media (max-width: 480px) { .pill .dist-f, .pill .div { display: none; } .pill { grid-template-columns: minmax(0, 1fr) auto; } }

  /* Quick filters */
  .quick { display: flex; gap: 8px; overflow-x: auto; padding: 20px 0 4px; scrollbar-width: none; }
  .quick::-webkit-scrollbar { display: none; }
  .q { flex: none; font: 500 16px var(--sans); min-height: 42px; padding: 0 16px; border-radius: 99px; border: 1px solid #877A6E; background: #fff; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .q:hover { background: var(--sky); }
  .q .ic { width: 16px; height: 16px; }
  .q .tick { display: none; }
  .q[aria-pressed="true"] { background: var(--lilac); border-color: var(--lilac-7); color: var(--lilac-8); font-weight: 600; }
  .q[aria-pressed="true"] .tick { display: inline; }
  .q.all { border-color: var(--ink); font-weight: 600; }
  .q .n { background: var(--lilac-8); color: #fff; border-radius: 99px; min-width: 20px; height: 20px; display: inline-grid; place-items: center; font-size: 12px; font-weight: 700; }

  .head { display: flex; flex-wrap: wrap; gap: 8px 20px; align-items: end; justify-content: space-between; padding: 28px 0 8px; }
  h1 { font: 400 clamp(28px, 3.2vw, 38px)/1.15 var(--serif); letter-spacing: -0.015em; margin: 0; }
  .head p { margin: 4px 0 0; color: var(--ink-2); }
  .seg { display: inline-flex; background: var(--sky); padding: 4px; border-radius: 99px; gap: 2px; }
  .seg button { font: 500 14px var(--sans); color: var(--sky-8); background: none; border: 0; min-height: 36px; padding: 0 14px; border-radius: 99px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .seg button[aria-pressed="true"] { background: #fff; color: var(--ink); font-weight: 600; box-shadow: 0 1px 3px rgba(34,64,92,.18); }

  /* Cards */
  .grid { display: grid; gap: 28px 24px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 290px), 1fr)); padding: 20px 0 96px; }
  .card { position: relative; display: grid; gap: 10px; align-content: start; }
  .ph { position: relative; aspect-ratio: 5 / 4; border-radius: var(--r); overflow: hidden; background: var(--sky); }
  .ph img { width: 100%; height: 100%; object-fit: cover; transition: transform .5s cubic-bezier(.2,.8,.2,1); }
  .card:hover .ph img { transform: scale(1.04); }
  .ph .at { position: absolute; left: 12px; bottom: 12px; right: 12px; display: flex; }
  .ph .at span { display: inline-flex; align-items: center; gap: 6px; background: rgba(255,255,255,.95); border-radius: 99px; padding: 6px 12px 6px 10px; font: 600 14px var(--sans); box-shadow: 0 4px 14px -4px rgba(41,22,5,.3); max-width: 100%; }
  .ph .at .ic { color: var(--rust); width: 16px; height: 16px; }
  .ph .ex { position: absolute; top: 12px; right: 12px; font: 600 12px/1 var(--sans); color: var(--ink); background: rgba(255,255,255,.92); border-radius: 99px; padding: 5px 9px; border: 1px dashed var(--ink-2); }
  .card h2 { font: 500 24px/1.15 var(--serif); margin: 6px 0 0; letter-spacing: -0.01em; }
  .card h2 a { text-decoration: none; }
  .card h2 a::after { content: ""; position: absolute; inset: 0; }
  .card:has(h2 a:focus-visible) .ph { outline: 2px solid var(--rust); outline-offset: 3px; }
  .card h2 a:focus-visible { outline: none; }
  .line { margin: 0; font-size: 16px; color: var(--ink-2); }
  .line .ver { color: var(--lilac-7); font-weight: 600; display: inline-flex; align-items: center; gap: 4px; }
  .line .ver .ic { width: 16px; height: 16px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; }
  .tag { font: 500 13px var(--sans); color: var(--sky-8); background: var(--sky); border-radius: 99px; padding: 3px 10px; }
  .foot { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-top: 4px; }
  .next { font: 600 13px var(--sans); color: var(--rust-8); background: var(--peach); border-radius: 99px; padding: 5px 10px; }
  .price { font-weight: 600; } .price small { font-weight: 400; color: var(--ink-2); font-size: 14px; }

  /* Sheet */
  .scrim { position: fixed; inset: 0; z-index: 30; background: rgba(41,22,5,.35); display: none; align-items: stretch; justify-content: flex-end; }
  .scrim[data-open="true"] { display: flex; }
  .sheet { width: min(460px, 100%); background: #fff; display: grid; grid-template-rows: auto minmax(0, 1fr) auto; box-shadow: -20px 0 60px -20px rgba(41,22,5,.35); animation: in .32s cubic-bezier(.2,.8,.2,1); }
  @keyframes in { from { transform: translateX(24px); opacity: .4; } }
  @media (prefers-reduced-motion: reduce) { .sheet { animation: none; } }
  .sheet header, .sheet footer { display: flex; justify-content: space-between; align-items: center; padding: 16px 20px; }
  .sheet header { border-bottom: 1px solid var(--rule); }
  .sheet header h2 { margin: 0; font: 400 24px var(--serif); }
  .sheet footer { border-top: 1px solid var(--rule); }
  .sheet .body { overflow-y: auto; padding: 4px 20px 20px; }
  .sheet fieldset { border: 0; padding: 0; margin: 22px 0 0; min-width: 0; }
  .sheet legend { font-weight: 600; margin-bottom: 10px; padding: 0; }
  .sheet .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .x { width: 44px; height: 44px; border-radius: 50%; border: 0; background: none; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
  .x:hover { background: var(--sky); }
  .btn { font: 600 16px var(--sans); min-height: 48px; padding: 0 22px; border-radius: 99px; border: 0; background: var(--rust); color: #fff; cursor: pointer; }
  .btn:hover { background: var(--rust-d); }
  .quiet { font: 600 16px var(--sans); background: none; border: 0; min-height: 44px; padding: 0 8px; text-decoration: underline; text-underline-offset: 3px; cursor: pointer; color: var(--ink); }
:root { --x-accent: var(--sky-8); --x-tint: var(--peach); --x-call-ink: var(--rust-d); --x-line: var(--rule); --x-r: 18px; }
  .exm { color: var(--x-accent); font-weight: 700; margin-left: 2px; }
  .x-hints { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }
  .x-hint { font-size: 14px; font-weight: 600; color: var(--x-accent); }
  .x-legend { font-size: 14px; color: var(--ink-2); }
  :root { --x-pin: #22405C; --x-pin-on: #9B5212; }
  [hidden] { display: none !important; }
  /* Map view and small-cohort widening */
  .x-mapview { display: grid; gap: 20px; margin: 24px 0; }
  .x-mapview[hidden] { display: none; }
  @media (min-width: 900px) { .x-mapview { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; } }
  .x-map { height: 440px; border-radius: var(--x-r, 12px); overflow: hidden; position: relative; z-index: 0; background: #E9ECE6; }
  @media (max-width: 600px) { .x-map { height: 340px; } }
  .x-maplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .x-maplist li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 12px; border: 1px solid var(--x-line); border-radius: var(--x-r, 12px); background: #fff; }
  .x-maplist a { font-weight: 600; color: var(--ink); }
  .x-maplist div > span { display: block; font-size: 14px; color: var(--ink-2); }
  .x-num { width: 28px; height: 28px; border-radius: 50%; background: var(--x-pin); color: #fff; display: grid; place-items: center; font: 700 13px var(--sans); }
  .x-more { margin: 24px 0 0; color: var(--ink-2); }
  .x-widen { font: 600 16px var(--sans); color: var(--ink); background: #fff; border: 1.5px solid var(--ink); border-radius: var(--x-r, 12px); min-height: 44px; padding: 0 16px; margin-left: 8px; cursor: pointer; }
  .x-widen:hover { background: var(--x-tint); }
</style>
</head>
<body>
<header class="top">
  <div class="wrap">
    <a class="logo" href="c3-home.html">emu.</a>
    <form class="pill" role="search" onsubmit="return false">
      <div class="f"><label for="loc">Where</label><input id="loc" value="Philadelphia, PA" autocomplete="address-level2"></div>
      <span class="div" aria-hidden="true"></span>
      <div class="f dist-f"><label for="dist">Distance</label><select id="dist"><option>Within 5 miles</option><option selected>Within 10 miles</option><option>Within 25 miles</option><option>Within 50 miles</option></select></div>
      <button class="go" aria-label="Search" id="go"></button>
    </form>
    <nav aria-label="Main"><a href="#">For therapists</a></nav>
  </div>
</header>

<main class="wrap">
  <div class="quick" role="group" aria-label="Quick filters" id="quick"></div>
  <div class="head">
    <div><h1>Therapists near Philadelphia</h1><p aria-live="polite">4 therapists within 10 miles</p></div>
    <div class="seg" role="group" aria-label="View" data-toggle-group><button aria-pressed="true" id="v1"></button><button aria-pressed="false" id="v2"></button></div>
  </div>
  <div class="grid" id="grid"></div><div class="x-mapview" id="mapview" hidden><div class="x-map" id="dirmap" role="region" aria-label="Map of therapists near Philadelphia"></div><div id="maplist"></div></div><p class="x-more">Want more choice? <button type="button" class="x-widen">Search within 25 miles</button></p>
</main>

<div class="scrim" id="scrim">
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="fs-title">
    <header><h2 id="fs-title">All filters</h2><button class="x" aria-label="Close filters" id="close"></button></header>
    <div class="body" id="fbody"></div>
    <footer><button class="quiet">Clear all</button><button class="btn" id="show">Show 4 therapists</button></footer>
  </div>
</div>

<script>
  const { icon, placeIcon, mockBar } = KIT;
  mockBar(3, 'Soft app', 'c3-profile.html', 'Profile');
  document.getElementById('go').innerHTML = icon('search');
  document.getElementById('close').innerHTML = icon('x');
  document.getElementById('v1').innerHTML = icon('list') + 'List';
  document.getElementById('v2').innerHTML = icon('map') + 'Map';

  // Quick filters: real options, each toggles independently
  // No issue chips up front (Rachel: small launch cohort, avoid zero results). Only the active filter shows.
  const quick = [['Self-pay', null, true]];
  document.getElementById('quick').innerHTML =
    `<button class="q all" id="all">${icon('sliders')}All filters <span class="n">1</span><span class="sr"> active</span></button>` +
    quick.map(([l, ic, on]) => `<button class="q" aria-pressed="${!!on}">${icon('check', 'ic tick')}${ic ? icon(ic) : ''}${l}</button>`).join('');
  document.querySelectorAll('.q[aria-pressed]').forEach(b => b.addEventListener('click', () => b.setAttribute('aria-pressed', b.getAttribute('aria-pressed') !== 'true')));

  document.getElementById('grid').innerHTML = EMU.therapists.map(p => `
    <article class="card">
      <div class="ph">
        <img src="${p.photo}" alt="Portrait of ${p.name}">
        <div class="at"><span>${icon(placeIcon(p.placeType))}${p.place}, ${p.distance}</span></div>
        ${p.example ? '<span class="ex">Example</span>' : ''}
      </div>
      <h2><a href="${p.example ? '#' : 'c3-profile.html'}">${p.name}</a></h2>
      <p class="line">${p.credential}</p>
      <p class="line"><span class="ver">${icon('badge')}License verified in ${p.state}</span></p><p class="line">${p.placeType}${p.id === 'jordan' ? KIT.moreLocs() : ''}</p>
      ${KIT.excerpt(p)}
      <div class="tags">${p.specialties.slice(0, 3).map(s => `<span class="tag">${s}</span>`).join('')}</div><div class="x-hints">${KIT.hints(p.id)}</div>
      <div class="foot"><span class="next">Next opening ${p.next.split(',')[0].slice(0, 3)}, ${p.next.split(', ')[1].replace('October', 'Oct')}</span><span class="price">$${p.price} <small>per session</small></span></div>
    </article>`).join('');

  document.getElementById('fbody').innerHTML = EMU.filters.map(([name, opts]) => {
    const pressed = (opts.find(o => EMU.search.activeFilters.includes(o)) || opts[0]);
    return `<fieldset><legend>${name}</legend><div class="chips" data-toggle-group>${opts.map(o => `<button type="button" class="q" aria-pressed="${o === pressed}">${icon('check', 'ic tick')}${o}</button>`).join('')}</div></fieldset>`;
  }).join('');

  const scrim = document.getElementById('scrim'), all = document.getElementById('all');
  const open = v => { scrim.dataset.open = v; if (v) document.getElementById('close').focus(); else all.focus(); };
  all.addEventListener('click', () => open(true));
  document.getElementById('close').addEventListener('click', () => open(false));
  document.getElementById('show').addEventListener('click', () => open(false));
  scrim.addEventListener('click', e => { if (e.target === scrim) open(false); });
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && scrim.dataset.open === 'true') open(false); });
  document.querySelector('main').insertAdjacentHTML('beforeend', `<p class="x-legend" style="padding:0 20px 40px;max-width:1200px;margin:0 auto">${KIT.exm} Example details for this mockup. Therapists haven't entered these yet.</p>`);

  // Map view
  const hrefFor = t => t.example ? '#' : 'c3-profile.html';
  document.getElementById('maplist').innerHTML = KIT.dirMapList(hrefFor);
  const showMap = on => { document.getElementById('mapview').hidden = !on; document.getElementById('grid').hidden = on; if (on) KIT.mountDirMap(document.getElementById('dirmap'), document.getElementById('maplist'), hrefFor); };
  document.getElementById('v2').addEventListener('click', () => showMap(true));
  document.getElementById('v1').addEventListener('click', () => showMap(false));
</script>
</body>
</html>
