<!doctype html>
<!-- CONCEPT 9: ON FOOT, profile. Plan is in c9-home.html.
     A full-bleed photo opens the page with Jordan on a solid panel. Then the page is a walk with Jordan,
     the trail line drawing through it as you scroll: who Jordan is, where you'll meet (three places as large
     photo tiles and a real map), booking (a normal card in the flow, never pinned), and finding Jordan on
     the day, set large on the night scene. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 9 profile</title>
<script src="data.js?v=8"></script>
<script src="kit.js?v=8"></script>
<script src="map.js?v=8"></script>
<script src="request.js?v=8"></script>
<script src="motion.js?v=2"></script>
<script>document.write(`<link rel="stylesheet" href="${EMU.brand.fontsHref}">`)</script>
<style>
  html { scrollbar-gutter: stable; scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }
  :root { --ink: #291605; --soft: #675D55; --line: #E3E0DD; --night: #12302A; --amber: #E2A33B; --lilac: #EFD2F9; --plum: #4B2259; --rust: #9B5212; --rust-d: #6E3A0D; --error: #B42318;
    --serif: 'Newsreader', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  [hidden] { display: none !important; }
  body { margin: 0; background: #fff; color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; overflow-x: hidden; }
  a { color: inherit; }
  :focus-visible { outline: 3px solid var(--amber); outline-offset: 3px; }
  .ic { width: 18px; height: 18px; flex: none; }
  .wrap { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  @media (min-width: 768px) { .wrap { padding: 0 48px; } }
  header.top { position: absolute; left: 0; right: 0; z-index: 5; color: #fff; }
  header.top .wrap { display: flex; justify-content: space-between; align-items: center; min-height: 76px; }
  .logo { font: 400 32px/1 var(--serif); text-decoration: none; text-shadow: 0 1px 12px rgba(0,0,0,.4); }
  header nav a { text-decoration: none; font-weight: 600; padding: 12px; text-shadow: 0 1px 10px rgba(0,0,0,.45); }

  .hero { position: relative; min-height: 92vh; display: grid; align-items: end; overflow: hidden; background: var(--night); }
  .hero > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transform: scale(1.06); transition: transform 1.6s cubic-bezier(.2,.7,.2,1); }
  .hero.ready > img, html.reduce .hero > img { transform: none; }
  .hero::after { content: ""; position: absolute; inset: 0 0 auto; height: 160px; background: linear-gradient(rgba(0,0,0,.42), transparent); pointer-events: none; }
  .hero .wrap { position: relative; z-index: 2; width: 100%; padding-bottom: 36px; }
  .panel { background: #fff; border-radius: 6px; padding: 28px; max-width: 640px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.6); display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: 4px 22px; }
  @media (min-width: 768px) { .panel { padding: 36px; grid-template-columns: 128px minmax(0, 1fr); } }
  .panel img { width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; grid-row: span 3; box-shadow: 0 0 0 3px #fff, 0 0 0 5px var(--amber); }
  .back { grid-column: 1 / -1; display: inline-flex; align-items: center; gap: 4px; min-height: 40px; font-weight: 500; text-decoration: none; margin: -8px 0 6px; justify-self: start; }
  h1 { font: 400 clamp(40px, 5.4vw, 66px)/1 var(--serif); letter-spacing: -0.025em; margin: 0; align-self: end; }
  .panel .cred { margin: 6px 0 0; color: var(--soft); }
  .ver { display: inline-flex; gap: 6px; align-items: center; font-size: 14px; font-weight: 600; color: var(--night); }
  .panel .row { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; margin-top: 16px; }
  .panel .price { font: 400 24px var(--serif); }
  .btn { font: 600 16px var(--sans); min-height: 50px; padding: 0 24px; border: 0; border-radius: 6px; background: var(--rust); color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; justify-content: center; transition: background-color .15s, transform .15s; }
  .btn:hover { background: var(--rust-d); }
  .btn:active { transform: translateY(1px); }
  .credit { position: absolute; right: 12px; bottom: 10px; z-index: 2; font-size: 12px; background: rgba(255,255,255,.92); padding: 3px 8px; border-radius: 4px; max-width: calc(100% - 24px); }
  @media (max-width: 767px) { .credit { position: static; display: inline-block; margin-top: 10px; } }

  .walk { padding-bottom: 24px; }
  .sec { padding: 96px 0; }
  @media (max-width: 767px) { .sec { padding: 64px 0 64px 24px; } }
  .sec h2 { font: 400 clamp(34px, 4vw, 52px)/1.05 var(--serif); letter-spacing: -0.02em; margin: 0 0 28px; }
  .about { display: grid; gap: 40px; }
  @media (min-width: 900px) { .about { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; } }
  .about h3 { font: 600 17px var(--sans); margin: 0 0 10px; }
  .about p { margin: 0; font: 400 clamp(21px, 2vw, 25px)/1.5 var(--serif); }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 28px 0 0; }
  .tags li { font-size: 15px; padding: 4px 12px; border-radius: 99px; border: 1px solid var(--line); }

  .tiles { display: grid; gap: 16px; }
  @media (min-width: 900px) { .tiles { grid-template-columns: 1.3fr 1fr 1fr; } }
  .tile { position: relative; min-height: 380px; border-radius: 6px; overflow: hidden; background: var(--night); color: #fff; display: grid; align-content: end; }
  .tile > img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .9s cubic-bezier(.2,.7,.2,1); }
  .tile:hover > img { transform: scale(1.05); }
  .tile.fallback > img { opacity: .45; }
  .tile .big { position: absolute; inset: 0 0 40%; display: grid; place-items: center; }
  .tile .card { position: relative; background: #fff; color: var(--ink); margin: 12px; padding: 16px 18px; border-radius: 4px; display: grid; gap: 4px; }
  .tile .card b { font: 400 24px/1.15 var(--serif); }
  .tile .card .t { font-size: 14px; color: var(--soft); }
  .tile .card .i { margin: 4px 0 0; }
  .tile .card small { font-size: 12px; color: var(--soft); }
  .tile .n { position: absolute; top: 14px; left: 14px; width: 32px; height: 32px; border-radius: 50%; background: var(--amber); color: var(--ink); display: grid; place-items: center; font-weight: 700; }
  .x-map { height: 420px; border-radius: 6px; overflow: hidden; position: relative; z-index: 0; background: #DCE5E1; margin-top: 16px; }
  .x-place { margin-top: 16px; display: grid; gap: 6px; max-width: 70ch; }
  .x-place p { margin: 0; }

  /* Booking: a card in the flow */
  .book { display: grid; gap: 0; border-radius: 8px; overflow: hidden; box-shadow: 0 30px 80px -40px rgba(18,48,42,.6); border: 1px solid var(--line); }
  @media (min-width: 900px) { .book { grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); } }
  .book .pick { padding: 28px; }
  .book .side { padding: 28px; background: var(--night); color: #fff; display: grid; gap: 14px; align-content: start; }
  .book .side .price { font: 400 32px/1 var(--serif); margin: 0; }
  .dayblk + .dayblk { margin-top: 16px; }
  .dayblk h4 { margin: 0 0 6px; font: 600 15px var(--sans); }
  .per { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: start; }
  .per + .per { margin-top: 6px; }
  .per > span { font-size: 14px; color: var(--soft); padding-top: 9px; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; }
  .slot { font: 500 15px var(--sans); font-variant-numeric: tabular-nums; min-height: 40px; padding: 0 12px; border: 1px solid #877A6E; border-radius: 99px; background: #fff; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: background-color .15s, border-color .15s, transform .15s; }
  .slot .ic { width: 14px; height: 14px; display: none; }
  .slot:hover { border-color: var(--night); transform: translateY(-1px); }
  .slot[aria-pressed="true"] { background: var(--night); border-color: var(--night); color: #fff; font-weight: 600; }
  .slot[aria-pressed="true"] .ic { display: inline; }
  html:not(.reduce) .slot[aria-pressed="true"] { animation: pop .25s cubic-bezier(.2,.7,.2,1); }
  @keyframes pop { 50% { transform: scale(1.06); } }
  .chosen { margin: 0; font: 400 20px/1.35 var(--serif); }
  .chosen.is-error { color: #FFD7D2; font: 600 16px var(--sans); }
  .side .btn { background: var(--lilac); color: var(--plum); width: 100%; }
  .side .btn:hover { background: #fff; }
  .side .fine { margin: 0; font-size: 14px; color: #C9D7D2; }

  .find { position: relative; padding: 140px 0; background: var(--night); color: #fff; overflow: hidden; }
  .find q { display: block; font: 400 clamp(36px, 5vw, 68px)/1.12 var(--serif); letter-spacing: -0.02em; max-width: 20ch; quotes: none; }
  .find p { margin: 20px 0 0; color: #C9D7D2; }
  .find svg { position: absolute; right: 8%; top: 50%; width: 120px; height: 120px; transform: translateY(-50%); }
  @media (max-width: 767px) { .find svg { display: none; } .find { padding: 96px 0 96px 24px; } }
  .more2 { display: grid; gap: 48px; }
  @media (min-width: 900px) { .more2 { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 64px; } }
  .methods dt { font: 400 22px/1.3 var(--serif); margin-top: 14px; }
  .methods dd { margin: 4px 0 0; color: var(--soft); }

  :root { --x-accent: var(--night); --x-tint: #E4ECE9; --x-line: var(--line); --x-r: 6px; --x-pin: #12302A; --x-pin-on: #9B5212; }
  .exm { color: var(--plum); font-weight: 700; margin-left: 2px; }
  .x-facts { margin: 0; }
  .x-row { display: grid; grid-template-columns: 150px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--x-line); }
  .x-row dt { font-weight: 600; color: var(--soft); }
  .x-row dd { margin: 0; font: 400 19px/1.5 var(--serif); }
  .x-call { background: var(--lilac); color: var(--plum); border-radius: 6px; padding: 14px 16px; display: grid; gap: 2px; margin: 0 0 18px; }
  .x-call b { font-weight: 600; }
  .x-call span { font-size: 14px; color: var(--ink); }
  .x-notice { margin: 0 0 16px; color: var(--soft); }
  .side .x-h { font-weight: 600; margin: 4px 0 6px; }
  .side .x-next ol { margin: 0; padding-left: 20px; color: #D9E3DF; font-size: 15px; }
  .x-ask { font: 600 15px var(--sans); min-height: 44px; width: 100%; padding: 0 14px; border: 1.5px dashed #9FB4AD; background: transparent; border-radius: 6px; color: #fff; cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .x-prop { font-size: 12px; font-weight: 600; color: #C9D7D2; border: 1px solid #9FB4AD; border-radius: 99px; padding: 1px 7px; }
  .side .x-note { font-size: 14px; color: #C9D7D2; margin: 6px 0 0; }
  .x-picker .x-h { font-weight: 600; margin: 0 0 8px; }
  .x-locs { display: grid; gap: 8px; }
  .x-loc { font: inherit; text-align: left; display: grid; grid-template-columns: 16px 26px minmax(0, 1fr); gap: 10px; align-items: center; min-height: 56px; padding: 8px 14px; border: 1px solid #877A6E; border-radius: 6px; background: #fff; color: var(--ink); cursor: pointer; transition: border-color .15s, background-color .15s; }
  .x-loc:hover { border-color: var(--night); }
  .x-loc small { display: block; font-size: 13px; color: var(--soft); font-weight: 400; }
  .x-loc .x-tick { visibility: hidden; width: 16px; height: 16px; color: var(--night); }
  .x-loc .x-n { width: 26px; height: 26px; border-radius: 50%; background: var(--amber); color: var(--ink); display: grid; place-items: center; font: 700 12px var(--sans); }
  .x-loc[aria-pressed="true"] { border: 2px solid var(--night); background: #E4ECE9; font-weight: 600; }
  .x-loc[aria-pressed="true"] .x-tick { visibility: visible; }
  .x-hint-line, .x-none { font-size: 14px; color: var(--soft); margin: 8px 0 16px; }
  .x-moredates { color: var(--night); }
  .x-legend { font-size: 14px; color: var(--soft); margin: 0 0 40px; }
  .x-foot { background: var(--night); color: #D9E3DF; padding: 32px 16px 56px; font-size: 14px; }
  @media (min-width: 768px) { .x-foot { padding: 32px 48px 56px; } }
  .x-foot p { margin: 0 auto 8px; max-width: 1104px; }
  .x-crisis { color: #fff !important; font-weight: 600; }
  :root { --rq-ink:#291605;--rq-soft:#675D55;--rq-panel:#E4ECE9;--rq-line:#E3E0DD;--rq-accent:#9B5212;--rq-accent-hover:#6E3A0D;--rq-radius:8px;--rq-btn-radius:6px;--rq-title-font:400 30px/1.1 'Newsreader',Georgia,serif;--rq-sans:'Inter',system-ui,sans-serif; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="c9-home.html">emu.</a><nav aria-label="Main"><a href="c9-directory.html">Find a therapist</a><a href="#">For therapists</a></nav></div></header>
<main id="main"></main>
<script>
  const { icon, mockBar, booking, fullSlot, facts, freeCall, whatNext, contact, legend, notice, payLine, crisisFoot, locPicker, wireLocs, mountLocMap, placeMore, exm, placeIcon } = KIT;
  mockBar(9, 'On foot');
  const j = EMU.therapists[0], P = EMU.profile, PH = EMU.photos, L = P.locations;
  const photoFor = l => l.id === 'trail' ? PH.trailWalk : l.id === 'library' ? PH.library : null;
  const slot = (d, t) => `<button class="slot" aria-pressed="false" data-t="${fullSlot(d, t)}">${icon('check')}${t}</button>`;
  const per = (lab, d, ts) => ts.length ? `<div class="per"><span>${lab}</span><div class="slots" role="group" aria-label="${d}, ${lab.toLowerCase()}">${ts.map(t => slot(d, t)).join('')}</div></div>` : '';
  const daysHTML = av => av.map(d => `<div class="dayblk"><h4>${d.day}</h4>${per('Morning', d.day, d.morning)}${per('Afternoon', d.day, d.afternoon)}</div>`).join('');

  document.getElementById('main').innerHTML = `
    <section class="hero" id="hero">
      <img src="${PH.trailCity.src}" alt="${PH.trailCity.alt}">
      <div class="wrap">
        <div class="panel rv">
          <a class="back" href="c9-directory.html">${icon('left')}Back to your search</a>
          <img src="${j.photo}" alt="Portrait of ${j.name}">
          <h1>${j.name}</h1>
          <div><p class="cred">${j.credential}, ${j.city}</p><span class="ver">${icon('badge')}License verified in ${j.state}</span></div>
          <div class="row"><span class="price">$${j.price} per session</span><a class="btn" href="#book">Check times</a></div>
        </div>
        <small class="credit">${PH.trailCity.credit}</small>
      </div>
    </section>
    <div class="walk" id="walk">
      <section class="sec wrap" data-stop aria-labelledby="h-about">
        <h2 id="h-about" class="rv">A walk with Jordan</h2>
        <div class="about"><div class="rv"><h3>About me</h3><p>${P.about}</p></div><div class="rv" data-d="1"><h3>What you can expect</h3><p>${P.expect}</p></div></div>
        <ul class="tags rv" aria-label="${EMU.labels.focus}">${j.specialties.map(s => `<li>${s}</li>`).join('')}</ul>
      </section>
      <section class="sec wrap" data-stop aria-labelledby="h-where">
        <h2 id="h-where" class="rv">Where you'll meet</h2>
        <div class="tiles">${L.map((l, i) => { const ph = photoFor(l); return `
          <div class="tile ${ph ? '' : 'fallback'} rv" data-d="${i + 1}">
            <img src="${ph ? ph.src : EMU.brand.images.textures}" alt="${ph ? ph.alt : ''}" loading="lazy">
            ${ph ? '' : `<span class="big" aria-hidden="true">${icon(placeIcon(l.tags[0])).replace('class="ic"', 'class="ic" style="width:80px;height:80px"')}</span>`}
            <span class="n" aria-hidden="true">${i + 1}</span>
            <div class="card"><b>${l.name}${l.example ? exm : ''}</b><span class="t">${l.tags.join(', ')}. ${l.address}</span><p class="i">${l.instructions}${l.example ? exm : ''}</p>${ph ? `<small>${ph.credit.split('. ').slice(1).join('. ')}</small>` : ''}</div>
          </div>`; }).join('')}</div>
        ${placeMore()}
        <div class="x-map rv" id="locmap" role="region" aria-label="Map of Jordan's three meeting places, numbered to match the tiles"></div>
      </section>
      <section class="sec wrap" data-stop id="book" aria-labelledby="h-book">
        <h2 id="h-book" class="rv">Book a session</h2>
        <div class="book rv" id="bookcard">
          <div class="pick">${notice()}${locPicker()}<div data-days></div></div>
          <div class="side">
            <p class="price">$${j.price} per session</p>
            ${freeCall()}
            <p class="chosen" data-chosen aria-live="polite">No time chosen yet</p>
            <button class="btn" data-request>Request appointment</button>
            <p class="fine">${payLine()}</p>
            ${whatNext()}${contact()}
          </div>
        </div>
      </section>
    </div>
    <section class="find" aria-labelledby="h-find">
      <div class="wrap"><h2 id="h-find" class="sr" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Finding Jordan on the day</h2><q class="rv">${L[0].instructions}</q><p class="rv" data-d="1">Jordan's meeting instructions for ${L[0].name}.</p></div>
      <svg viewBox="0 0 120 120" aria-hidden="true"><circle class="pulse" cx="60" cy="60" r="16" fill="#EFD2F9"/><circle cx="60" cy="60" r="14" fill="#EFD2F9" stroke="#E2A33B" stroke-width="4"/></svg>
    </section>
    <section class="sec wrap"><div class="more2">
      <div class="rv"><h2>${EMU.labels.approaches}</h2><dl class="methods">${P.methods.map(([n, d]) => `<dt>${n}</dt><dd>${d}</dd>`).join('')}</dl></div>
      <div class="rv" data-d="1"><h2>Good to know</h2>${facts()}</div>
    </div></section>
    <div class="wrap">${legend()}</div>`;

  const root = document.getElementById('bookcard');
  booking(root); wireLocs(root, daysHTML);
  mountLocMap(document.getElementById('locmap'));
  // Style the "See more available dates" link for the light side
  const hero = document.getElementById('hero'), hb = hero.querySelector('img');
  const ready = () => requestAnimationFrame(() => hero.classList.add('ready'));
  hb.complete ? ready() : hb.addEventListener('load', ready);
  MOTION.trail(document.getElementById('walk'), [.95, .96, .97]);
  MOTION.watch();
  document.body.insertAdjacentHTML('beforeend', crisisFoot());
</script>
</body>
</html>
