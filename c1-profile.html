<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 1 profile</title>
<script src="data.js?v=8"></script>
<script src="kit.js?v=8"></script>
<script src="map.js?v=8"></script>
<script src="request.js?v=8"></script>
<script>document.write(`<link rel="stylesheet" href="${EMU.brand.fontsHref}">`)</script>
<style>
  html { scrollbar-gutter: stable; }
  :root {
    --paper: #F5EFE6; --paper-2: #EFE6D9; --ink: #291605; --ink-2: #70655C; --rule: #DCCFBF;
    --rust: #9B5212; --rust-d: #6E3A0D; --moss: #3D5A3A; --moss-50: #E6EDE1;
    --lilac: #EFD2F9; --lilac-7: #6A307E; --lilac-8: #4B2259; --error: #B42318;
    --serif: 'Newsreader', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .ic { width: 18px; height: 18px; flex: none; }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  @media (min-width: 768px) { .wrap { padding: 0 40px; } }

  header.top { border-bottom: 1px solid var(--rule); }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 68px; }
  .logo { font: 700 22px/1 var(--sans); letter-spacing: -0.03em; text-decoration: none; }
  nav a { text-decoration: none; font-weight: 500; font-size: 16px; padding: 10px 12px; border-radius: 99px; }
  nav a:hover { background: var(--paper-2); }
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: 16px 0 0 -8px; padding: 0 12px 0 8px; border-radius: 99px; font-weight: 500; text-decoration: none; }
  .back:hover { background: var(--paper-2); }

  .page { display: grid; gap: 32px 56px; padding: 24px 0 96px;
    grid-template-columns: minmax(0, 1fr);
    grid-template-areas: "title" "notes" "about" "meet" "book" "methods"; }
  @media (min-width: 1080px) {
    .page { grid-template-columns: 220px minmax(0, 1fr) 340px;
      grid-template-areas: "notes title book" "notes about book" "notes meet book" "notes methods book"; align-items: start; }
  }
  .title { grid-area: title; }
  .notes { grid-area: notes; }
  .about { grid-area: about; } .meet { grid-area: meet; } .methods { grid-area: methods; } .book { grid-area: book; }

  h1 { font: 400 clamp(44px, 6vw, 76px)/1 var(--serif); letter-spacing: -0.025em; margin: 0; }
  .title .cred { margin: 14px 0 0; font-size: 18px; }
  .verified { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font: 600 16px var(--sans); color: var(--lilac-7); }

  .notes img { width: 100%; max-width: 220px; aspect-ratio: 4 / 5; object-fit: cover; border-radius: 14px; filter: saturate(.85); }
  .notes dl { margin: 20px 0 0; display: grid; gap: 0; }
  .notes dt { font: 600 13px/1.3 var(--sans); color: var(--ink-2); padding-top: 14px; border-top: 1px solid var(--rule); }
  .notes dd { margin: 4px 0 14px; font-size: 16px; }
  @media (max-width: 1079px) { .notes { display: grid; grid-template-columns: 120px minmax(0, 1fr); gap: 20px; align-items: start; } .notes dl { margin: 0; } }
  @media (min-width: 1080px) { .notes { position: sticky; top: 24px; } }

  section h2 { font: 400 30px/1.2 var(--serif); letter-spacing: -0.01em; margin: 0 0 14px; }
  .about p { margin: 0; font-size: 18px; line-height: 1.7; max-width: 62ch; }
  .about p + h2 { margin-top: 40px; }
  .about .expect { font: italic 400 24px/1.5 var(--serif); color: var(--ink); }

  .meet .note { background: var(--moss-50); border-radius: 18px; overflow: hidden; display: grid; }
  .meet .note .txt { padding: 28px; }
  .meet .place { display: flex; gap: 10px; align-items: center; font: 600 17px var(--sans); color: var(--moss); }
  .meet .addr { margin: 4px 0 0; font-size: 14px; color: var(--ink-2); padding-left: 28px; }
  .meet blockquote { margin: 20px 0 0; font: italic 400 26px/1.35 var(--serif); color: var(--ink); text-wrap: balance; }
  .meet iframe { width: 100%; height: 260px; border: 0; display: block; filter: saturate(.55) sepia(.15); }

  .methods dl { margin: 0; }
  .methods dt { font: 500 22px/1.3 var(--serif); padding-top: 18px; border-top: 1px solid var(--rule); }
  .methods dd { margin: 6px 0 18px; max-width: 60ch; }

  /* Booking */
  .book { background: #fff; border-radius: 18px; border: 1px solid var(--rule); box-shadow: 0 1px 2px rgba(41,22,5,.04), 0 18px 40px -18px rgba(41,22,5,.18); }
    .book .hd { padding: 24px 24px 16px; border-bottom: 1px solid var(--rule); }
  .book .hd h2 { margin: 0; font: 400 26px/1.2 var(--serif); }
  .book .hd p { margin: 6px 0 0; color: var(--ink-2); font-size: 16px; }
  .book .hd b { color: var(--ink); font-weight: 600; }
  .book .days { padding: 8px 24px 16px; }
  .day { padding: 14px 0; border-bottom: 1px dashed var(--rule); }
  .day:last-child { border-bottom: 0; }
  .day h3 { margin: 0 0 8px; font: 600 16px var(--sans); }
  .period { display: grid; grid-template-columns: 82px minmax(0, 1fr); gap: 8px; align-items: start; }
  .period + .period { margin-top: 6px; }
  .period > span { font-size: 14px; color: var(--ink-2); padding-top: 7px; }
  .slots { display: flex; flex-wrap: wrap; gap: 6px; }
  .slot { font: 500 14px var(--sans); font-variant-numeric: tabular-nums; min-height: 36px; padding: 0 12px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .slot:hover { border-color: var(--ink-2); }
  .slot .ic { width: 14px; height: 14px; display: none; }
  .slot[aria-pressed="true"] { background: var(--lilac); border-color: var(--lilac-7); color: var(--lilac-8); font-weight: 600; }
  .slot[aria-pressed="true"] .ic { display: inline; }
  .book .ft { padding: 16px 24px 24px; border-top: 1px solid var(--rule); display: grid; gap: 10px; }
  .chosen { margin: 0; font-weight: 500; min-height: 24px; }
  .chosen.is-error { color: var(--error); font-weight: 600; }
  .btn { font: 600 16px var(--sans); min-height: 48px; border-radius: 99px; border: 0; background: var(--rust); color: #fff; cursor: pointer; }
  .btn:hover { background: var(--rust-d); }
  .fine { margin: 0; font-size: 14px; color: var(--ink-2); }
:root { --x-accent: var(--moss); --x-tint: var(--moss-50); --x-line: var(--rule); --x-r: 14px; }
  /* Profile gap additions (shared classes, concept accents) */
  .exm { color: var(--x-accent); font-weight: 700; margin-left: 2px; text-decoration: none; }
  .x-facts { margin: 18px 0 0; }
  .x-row { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 12px; padding: 9px 0; border-top: 1px solid var(--x-line); }
  .x-row dt { font-weight: 600; font-size: 14px; color: var(--ink-2); }
  .x-row dd { margin: 0; font-size: 16px; }
  .x-call { background: var(--x-tint); border-radius: var(--x-r, 12px); padding: 14px 16px; display: grid; gap: 4px; margin-top: 14px; }
  .x-call b { color: var(--x-call-ink, var(--x-accent)); font-weight: 600; }
  .x-call span { font-size: 14px; color: var(--ink-2); }
  .x-notice { margin: 6px 0 0; font-size: 14px; color: var(--ink-2); }
  .x-next { margin-top: 6px; }
  .x-h { font-weight: 600; font-size: 14px; margin: 0 0 6px; }
  .x-next ol { margin: 0; padding-left: 20px; font-size: 14px; color: var(--ink-2); }
  .x-next li + li { margin-top: 3px; }
  .x-ask { font: 600 16px var(--sans); min-height: 44px; width: 100%; padding: 0 14px; border: 1.5px dashed #877A6E; background: transparent; border-radius: var(--x-r, 12px); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .x-ask:hover { border-style: solid; }
  .x-prop { font-size: 12px; font-weight: 600; color: var(--ink-2); border: 1px solid #877A6E; border-radius: 99px; padding: 1px 7px; }
  .x-note { font-size: 14px; color: var(--ink-2); margin: 6px 0 0; }
  .x-place { margin-top: 16px; display: grid; gap: 6px; }
  .x-place p { margin: 0; font-size: 16px; }
  .x-legend { font-size: 14px; color: var(--ink-2); margin: 32px 0 0; }
  .x-foot { max-width: 1200px; margin: 0 auto; padding: 28px 20px 48px; border-top: 1px solid var(--x-line); font-size: 14px; color: var(--ink-2); }
  @media (min-width: 768px) { .x-foot { padding: 28px 40px 48px; } }
  .x-foot p { margin: 0 0 8px; max-width: 75ch; }
  .x-crisis { color: var(--ink) !important; font-weight: 600; }
  .notes .x-facts { margin-top: 0; }
  .notes .x-row { grid-template-columns: 1fr; gap: 2px; padding: 12px 0; }
  .notes .x-row dt { font-size: 13px; }
  .x-hints { display: flex; flex-wrap: wrap; gap: 6px 12px; margin-top: 8px; }
  .x-hint { font-size: 14px; font-weight: 600; color: var(--x-accent); }
  :root { --x-pin: #3D5A3A; --x-pin-on: #9B5212; }
  /* Locations, picker and map (live app: several places per therapist, location-first booking) */
  .x-map { height: 320px; border-radius: var(--x-r, 12px); overflow: hidden; position: relative; z-index: 0; background: #E9ECE6; }
  .x-also { margin-top: 20px; }
  .x-loclist { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 10px; }
  .x-locitem { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 12px; padding: 10px; border-radius: var(--x-r, 12px); transition: background-color .2s ease-out; }
  .x-locitem.is-on { background: var(--x-tint); }
  .x-num { width: 28px; height: 28px; border-radius: 50%; background: var(--x-pin); color: #fff; display: grid; place-items: center; font: 700 13px var(--sans); }
  .x-locname { margin: 0; font-weight: 600; display: flex; flex-wrap: wrap; gap: 4px 8px; align-items: center; }
  .x-tag { font-size: 12px; font-weight: 600; color: var(--x-accent); border: 1px solid currentColor; border-radius: 99px; padding: 1px 8px; }
  .x-addr { margin: 2px 0 0; font-size: 14px; color: var(--ink-2); }
  .x-instr { margin: 6px 0 0; }
  .x-picker { margin: 4px 0 14px; }
  .x-locs { display: grid; gap: 6px; }
  .x-loc { font: inherit; font-size: 16px; text-align: left; display: grid; grid-template-columns: 16px 22px minmax(0, 1fr); gap: 8px; align-items: center; min-height: 48px; padding: 6px 10px; border: 1px solid #877A6E; border-radius: var(--x-r, 12px); background: #fff; color: var(--ink); cursor: pointer; }
  .x-loc:hover { border-color: var(--ink); }
  .x-loc small { display: block; font-size: 12px; color: var(--ink-2); font-weight: 400; }
  .x-loc .x-tick { visibility: hidden; width: 16px; height: 16px; }
  .x-loc .x-n { width: 22px; height: 22px; border-radius: 50%; background: var(--x-pin); color: #fff; display: grid; place-items: center; font: 700 12px var(--sans); }
  .x-loc[aria-pressed="true"] { border-color: var(--x-pin); background: var(--x-tint); font-weight: 600; }
  .x-loc[aria-pressed="true"] .x-tick { visibility: visible; }
  .x-hint-line, .x-none { font-size: 14px; color: var(--ink-2); margin: 6px 0 0; }
  :root { --rq-ink:#291605;--rq-soft:#70655C;--rq-bg:#FFFDF9;--rq-panel:#E6EDE1;--rq-line:#DCCFBF;--rq-accent:#9B5212;--rq-accent-hover:#6E3A0D;--rq-radius:14px;--rq-serif:'Newsreader',Georgia,serif;--rq-sans:'Inter',system-ui,sans-serif; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="c1-home.html">emu.</a><nav aria-label="Main"><a href="c1-directory.html">Find a therapist</a><a href="#">For therapists</a></nav></div></header>

<main class="wrap">
  <a class="back" href="c1-directory.html" id="back">Back to your search</a>
  <div class="page" id="page"></div>
</main>

<script>
  const { icon, mockBar, booking, fullSlot, ex, exm, facts, freeCall, whatNext, placeMore, contact, legend, notice, payLine, crisisFoot, otherLocs, locPicker, wireLocs, mountLocMap, moreLocs } = KIT;
  mockBar(1, 'Field notes', 'c1-directory.html', 'Directory');
  const j = EMU.therapists[0], P = EMU.profile, L = P.location;
  document.getElementById('back').insertAdjacentHTML('afterbegin', icon('left'));

  const slot = (day, t) => `<button class="slot" aria-pressed="false" data-t="${fullSlot(day, t)}">${icon('check')}${t}</button>`;
  const period = (label, day, ts) => ts.length ? `<div class="period"><span>${label}</span><div class="slots" role="group" aria-label="${day}, ${label.toLowerCase()}">${ts.map(t => slot(day, t)).join('')}</div></div>` : '';

  const daysHTML = av => av.map(d => `<div class="day"><h3>${d.day}</h3>${period('Morning', d.day, d.morning)}${period('Afternoon', d.day, d.afternoon)}</div>`).join('');
  document.getElementById('page').innerHTML = `
    <div class="title">
      <h1>${j.name}</h1>
      <p class="cred">${j.credential}, ${j.city}</p>
      <span class="verified">${icon('badge')}License verified in ${j.state}</span>
    </div>

    <aside class="notes" aria-label="At a glance">
      <img src="${j.photo}" alt="Portrait of ${j.name}">
      <dl>
        <dt>${EMU.labels.focus}</dt><dd>${j.specialties.join(', ')}</dd>
        <dt>Meets at</dt><dd>${L.name}${moreLocs()}, ${L.type.toLowerCase()}</dd>
        <dt>Fee</dt><dd>$${j.price} per session, paid to ${j.name.split(' ')[0]} directly</dd>
      </dl>
      ${facts()}
    </aside>

    <section class="about" aria-labelledby="h-about">
      <h2 id="h-about">About me</h2>
      <p>${P.about}</p>
      <h2>What you can expect</h2>
      <p class="expect">${P.expect}</p>
    </section>

    <section class="meet" aria-labelledby="h-meet">
      <h2 id="h-meet">Where you'll meet</h2>
      <div class="note">
        <div class="txt">
          <span class="place">${icon('leaf')}${L.name}, ${L.type.toLowerCase()}</span>
          <p class="addr">${L.address}</p>
          <blockquote>${L.instructions}</blockquote>${placeMore()}
        </div>
        <div class="x-map" id="locmap" role="region" aria-label="Map of Jordan's three meeting places"></div>${otherLocs()}
      </div>
    </section>

    <section class="methods" aria-labelledby="h-methods">
      <h2 id="h-methods">${EMU.labels.approaches}</h2>
      <dl>${P.methods.map(([n, d]) => `<dt>${n}</dt><dd>${d}</dd>`).join('')}</dl>
    </section>

    <aside class="book" aria-labelledby="h-book">
      <div class="hd"><h2 id="h-book">Choose a time</h2><p><b>$${j.price}</b> per session</p>${notice()}${freeCall()}</div>
      <div class="days">${locPicker()}<div data-days></div></div>
      <div class="ft">
        <p class="chosen" data-chosen aria-live="polite">No time chosen yet</p>
        <button class="btn" data-request>Request appointment</button>
        <p class="fine">${payLine()}</p>${whatNext()}${contact()}
      </div>
    </aside>`;
  booking(document.getElementById('page'));
  wireLocs(document.getElementById('page'), daysHTML);
  mountLocMap(document.getElementById('locmap'));
  document.querySelector('main').insertAdjacentHTML('beforeend', legend());
  document.querySelector('main').insertAdjacentHTML('afterend', crisisFoot());
</script>
</body>
</html>
