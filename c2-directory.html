<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 2 directory</title>
<script src="data.js?v=8"></script>
<script src="kit.js?v=8"></script>
<script src="map.js?v=8"></script>
<script>document.write(`<link rel="stylesheet" href="${EMU.brand.fontsHref}">`)</script>
<style>
  html { scrollbar-gutter: stable; }
  :root {
    --ink: #291605; --ink-2: #70655C; --rule: #E3E0DD; --cream: #FCFAF8;
    --rust: #9B5212; --rust-d: #6E3A0D;
    --plum: #4B2259; --plum-2: #5C2D6C; --lilac: #EFD2F9; --lilac-1: #F6E4FC; --lilac-7: #6A307E;
    --sage: #3B5A45; --sage-pin: #5E7F68; --sage-50: #E3ECE5; --water: #C9D8DF; --land: #EEF1EA; --park: #D3E2CC;
    --serif: 'Newsreader', Georgia, serif; --sans: 'Inter', system-ui, sans-serif;
    --hdr: 64px;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: #fff; color: var(--ink); font: 400 16px/1.55 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  :focus-visible { outline: 2px solid var(--rust); outline-offset: 2px; }
  .ic { width: 18px; height: 18px; flex: none; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

  header.top { height: var(--hdr); display: flex; align-items: center; justify-content: space-between; padding: 0 20px; border-bottom: 1px solid var(--rule); }
  .logo { font: 700 22px/1 var(--sans); letter-spacing: -0.03em; text-decoration: none; }
  nav a { text-decoration: none; font-weight: 500; font-size: 16px; padding: 10px 12px; border-radius: 99px; }
  nav a:hover { background: var(--cream); }

  /* Plum search band */
  .band { background: var(--plum); color: #fff; padding: 14px 20px; }
  .band form { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: center; }
  .band .loc { position: relative; flex: 1 1 260px; max-width: 420px; }
  .band .loc .ic { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); color: var(--plum); }
  .band input { width: 100%; font: 500 16px var(--sans); min-height: 46px; padding: 0 14px 0 42px; border-radius: 99px; border: 0; color: var(--ink); }
  .band input:focus-visible, .band :focus-visible { outline-color: var(--lilac); }
  .dist { display: inline-flex; padding: 4px; gap: 2px; border-radius: 99px; background: var(--plum-2); }
  .dist button { font: 500 14px var(--sans); color: var(--lilac); background: none; border: 0; min-height: 38px; padding: 0 12px; border-radius: 99px; cursor: pointer; display: inline-flex; align-items: center; gap: 4px; }
  .dist button .ic { width: 14px; height: 14px; display: none; }
  .dist button[aria-pressed="true"] { background: var(--lilac); color: var(--plum); font-weight: 700; }
  .dist button[aria-pressed="true"] .ic { display: inline; }
  .fbtn { font: 600 16px var(--sans); color: #fff; background: none; border: 1.5px solid var(--lilac); border-radius: 99px; min-height: 44px; padding: 0 16px; display: inline-flex; align-items: center; gap: 8px; cursor: pointer; }
  .fbtn .n { background: var(--lilac); color: var(--plum); border-radius: 99px; min-width: 22px; height: 22px; display: inline-grid; place-items: center; font-size: 13px; font-weight: 700; }
  .band .chip { font: 600 14px var(--sans); color: var(--plum); background: var(--lilac-1); border: 0; border-radius: 99px; min-height: 32px; padding: 0 8px 0 12px; display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
  .band .chip .ic { width: 14px; height: 14px; }

  /* Split */
  .split { display: grid; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) { .split { grid-template-columns: minmax(420px, 520px) minmax(0, 1fr); } }
  .list { padding: 24px 20px 64px; }
  .list h1 { font: 400 32px/1.15 var(--serif); letter-spacing: -0.01em; margin: 0; }
  .list .sub { margin: 6px 0 0; color: var(--ink-2); }
  ol.items { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; }
  .item { position: relative; display: grid; grid-template-columns: 36px minmax(0, 1fr); gap: 4px 14px; padding: 18px; border-radius: 16px; border: 1px solid var(--rule); background: #fff; transition: border-color .15s ease-out, box-shadow .2s ease-out, background-color .2s; }
  .item:hover, .item.is-hot { border-color: var(--sage-pin); background: #FAFCF9; box-shadow: 0 10px 24px -14px rgba(59,90,69,.45); }
  .num { width: 32px; height: 32px; border-radius: 50%; background: var(--sage); color: #fff; display: grid; place-items: center; font: 700 14px var(--sans); }
  .item.is-hot .num { background: var(--rust); }
  .item .place { font: 500 24px/1.15 var(--serif); margin: 2px 0 0; }
  .item .ptype { font-size: 14px; color: var(--sage); font-weight: 600; margin: 2px 0 0; }
  .who { grid-column: 2; display: grid; grid-template-columns: 44px minmax(0, 1fr); gap: 12px; align-items: center; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--rule); }
  .who img { width: 44px; height: 44px; border-radius: 50%; object-fit: cover; }
  .who h2 { font: 600 17px/1.25 var(--sans); margin: 0; }
  .who h2 a { text-decoration: none; }
  .who h2 a::after { content: ""; position: absolute; inset: 0; border-radius: 16px; }
  .item:hover h2 a { text-decoration: underline; text-underline-offset: 3px; }
  .who .cred { font-size: 14px; color: var(--ink-2); margin: 0; }
  .who .ver { display: inline-flex; gap: 4px; align-items: center; font: 600 13px var(--sans); color: var(--lilac-7); }
  .who .ver .ic { width: 14px; height: 14px; }
  .tags { grid-column: 2; display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
  .tag { font: 500 13px var(--sans); color: var(--plum); background: var(--lilac-1); border-radius: 99px; padding: 3px 10px; }
  .meta { grid-column: 2; display: flex; justify-content: space-between; gap: 12px; margin-top: 12px; font-size: 14px; }
  .meta b { font-weight: 600; }
  .example { position: absolute; top: 14px; right: 14px; font: 600 12px/1 var(--sans); color: var(--ink-2); border: 1px dashed var(--ink-2); border-radius: 99px; padding: 4px 8px; }

  /* Map */
  .mapcol { position: relative; background: var(--land); border-left: 1px solid var(--rule); }
  @media (min-width: 960px) { .mapcol .inner { position: sticky; top: 0; height: 100dvh; } }
  @media (max-width: 959px) { .mapcol { order: -1; border-left: 0; border-bottom: 1px solid var(--rule); } .mapcol .inner { height: 260px; } }
  .mapcol svg.map { width: 100%; height: 100%; display: block; }
  .pin { cursor: pointer; }
  .pin circle { fill: var(--sage); stroke: #fff; stroke-width: 3; transition: fill .15s; }
  .pin text.n { fill: #fff; font: 700 13px var(--sans); }
  .pin .lbl rect { fill: #fff; stroke: var(--rule); }
  .pin .lbl text { fill: var(--ink); font: 600 13px var(--sans); }
  .pin.is-hot circle { fill: var(--rust); }
  .pin.is-hot .lbl rect { stroke: var(--rust); }
  .mapnote { position: absolute; left: 12px; bottom: 12px; font: 500 12px var(--sans); color: var(--ink-2); background: rgba(255,255,255,.9); padding: 4px 10px; border-radius: 99px; }
:root { --x-accent: var(--sage); --x-tint: var(--sage-50); --x-line: var(--rule); --x-r: 16px; }
  .exm { color: var(--x-accent); font-weight: 700; margin-left: 2px; }
  .x-hints { display: flex; flex-wrap: wrap; gap: 4px 14px; margin-top: 8px; }
  .x-hint { font-size: 14px; font-weight: 600; color: var(--x-accent); }
  .x-legend { font-size: 14px; color: var(--ink-2); }
  .item .x-hints, .item .x-about { grid-column: 2; }
  :root { --x-pin: #3B5A45; --x-pin-on: #9B5212; }
  [hidden] { display: none !important; }
  /* Map view and small-cohort widening */
  .x-mapview { display: grid; gap: 20px; margin: 24px 0; }
  .x-mapview[hidden] { display: none; }
  @media (min-width: 900px) { .x-mapview { grid-template-columns: minmax(0, 1.7fr) minmax(0, 1fr); align-items: start; } }
  .x-map { height: 440px; border-radius: var(--x-r, 12px); overflow: hidden; position: relative; z-index: 0; background: #E9ECE6; }
  @media (max-width: 600px) { .x-map { height: 340px; } }
  .x-maplist { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  .x-maplist li { display: grid; grid-template-columns: 30px minmax(0, 1fr); gap: 10px; padding: 12px; border: 1px solid var(--x-line); border-radius: var(--x-r, 12px); background: #fff; }
  .x-maplist a { font-weight: 600; color: var(--ink); }
  .x-maplist div > span { display: block; font-size: 14px; color: var(--ink-2); }
  .x-num { width: 28px; height: 28px; border-radius: 50%; background: var(--x-pin); color: #fff; display: grid; place-items: center; font: 700 13px var(--sans); }
  .x-more { margin: 24px 0 0; color: var(--ink-2); }
  .x-widen { font: 600 16px var(--sans); color: var(--ink); background: #fff; border: 1.5px solid var(--ink); border-radius: var(--x-r, 12px); min-height: 44px; padding: 0 16px; margin-left: 8px; cursor: pointer; }
  .x-widen:hover { background: var(--x-tint); }
</style>
</head>
<body>
<header class="top"><a class="logo" href="c2-home.html">emu.</a><nav aria-label="Main"><a href="#">For therapists</a><a href="#">About</a></nav></header>

<div class="band">
  <form onsubmit="return false" role="search">
    <div class="loc"><label for="loc" class="sr">City or ZIP code</label><span id="sicon"></span><input id="loc" value="Philadelphia, PA" autocomplete="address-level2"></div>
    <div class="dist" role="group" aria-label="Distance" data-toggle-group id="dist"></div>
    <button type="button" class="fbtn" id="fbtn"></button>
    <button type="button" class="chip" aria-label="Remove filter: Self-pay" id="chip"></button>
  </form>
</div>

<div class="split">
  <section class="list" aria-labelledby="h1">
    <h1 id="h1">Places to meet near Philadelphia</h1>
    <p class="sub" aria-live="polite">4 therapists within 10 miles. Numbers match the map.</p>
    <ol class="items" id="items"></ol><p class="x-more">Want more choice? <button type="button" class="x-widen">Search within 25 miles</button></p><div id="maplist" hidden></div><div id="mapview" hidden></div>
  </section>
  <div class="mapcol" aria-label="Map of results">
    <div class="inner" id="map"></div>
  </div>
</div>

<script>
  const { icon, placeIcon, mockBar } = KIT;
  mockBar(2, 'Place first', 'c2-profile.html', 'Profile');
  document.getElementById('sicon').outerHTML = icon('search');
  document.getElementById('dist').innerHTML = EMU.search.radii.map(r => `<button type="button" aria-pressed="${r === 10}">${icon('check')}${r} mi</button>`).join('');
  document.getElementById('fbtn').innerHTML = icon('sliders') + 'Filters <span class="n">1</span><span class="sr"> active</span>';
  document.getElementById('chip').innerHTML = 'Self-pay ' + icon('x');

  document.getElementById('items').innerHTML = EMU.therapists.map((p, i) => `
    <li class="item" data-i="${i}">
      <span class="num" aria-hidden="true">${i + 1}</span>
      <div>
        <p class="place">${p.place}</p>
        <p class="ptype">${p.placeType}, ${p.distance} away${p.id === 'jordan' ? KIT.moreLocs() : ''}</p>
      </div>
      <div class="who">
        <img src="${p.photo}" alt="Portrait of ${p.name}">
        <div>
          <h2><a href="${p.example ? '#' : 'c2-profile.html'}">${p.name}</a></h2>
          <p class="cred">${p.credential}</p>
          <span class="ver">${icon('badge')}License verified in ${p.state}</span>
        </div>
      </div>
      ${KIT.excerpt(p)}
      <div class="tags">${p.specialties.slice(0, 3).map(s => `<span class="tag">${s}</span>`).join('')}</div><div class="x-hints">${KIT.hints(p.id)}</div>
      <div class="meta"><span>Next opening <b>${p.next.replace(/day,/, 'day,')}</b></span><span><b>$${p.price}</b> per session</span></div>
      ${p.example ? '<span class="example">Example</span>' : ''}
    </li>`).join('');

  // Real map with numbered pins matching the list
  document.getElementById('map').innerHTML = '<div class="x-map" id="dirmap" role="region" aria-label="Map of therapists near Philadelphia" style="height:100%;border-radius:0"></div>';
  // Link list and pins
  const hot = i => { document.querySelectorAll('.item').forEach(el => el.classList.toggle('is-hot', el.dataset.i == i)); const m = document.getElementById('dirmap').__ctl; if (m && i >= 0) m.focus(+i + 1); };
  document.querySelectorAll('.item').forEach(el => { el.addEventListener('mouseenter', () => hot(el.dataset.i)); el.addEventListener('focusin', () => hot(el.dataset.i)); });
  document.querySelector('.items').addEventListener('mouseleave', () => hot(-1));
  document.querySelector('.list').insertAdjacentHTML('beforeend', `<p class="x-legend" style="padding:20px 0 0">${KIT.exm} Example details for this mockup. Therapists haven't entered these yet.</p>`);

  // Map view
  const hrefFor = t => t.example ? '#' : 'c2-profile.html';
  document.getElementById('maplist').innerHTML = KIT.dirMapList(hrefFor);
  const showMap = on => { document.getElementById('mapview').hidden = !on; document.getElementById('items').hidden = on; if (on) KIT.mountDirMap(document.getElementById('dirmap'), document.getElementById('maplist'), hrefFor); };
  KIT.mountDirMap(document.getElementById('dirmap'), null, hrefFor, { onVisible: nums => {
    document.querySelectorAll('.item').forEach(el => { el.hidden = !nums.includes(+el.dataset.i + 1); });
    document.querySelector('.list .sub').textContent = nums.length ? `${nums.length} of ${EMU.therapists.length} places in view. Numbers match the map.` : 'No places in this part of the map. Zoom out to see more.';
  } });
</script>
</body>
</html>
