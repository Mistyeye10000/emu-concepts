<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Concept 1 home</title>
<!--
  Concept 1 home: Field notes
  Memorable moment: the search is the headline's second sentence, set at display size beside a tall crop of people walking the Schuylkill River Trail.
  Colours: paper #F5EFE6, paper-2 #EFE6D9, ink #291605, moss #3D5A3A on moss-50 #E6EDE1, rust #9B5212 actions.
  Type: Newsreader 400 for display and field-note captions (italic only for place names, as in the directory); Inter for UI.
  Layout:  [ headline + sentence search      | tall photo  ]
           [ places: three captioned photos laid out like a notebook spread, staggered ]
           [ how it works: three short lines ]  [ for therapists, moss panel ]
           [ footer with disclaimer ]
  Revised in review: dropped a centred hero over a full-bleed photo (the stock landing move) for an asymmetric split that matches the directory's sidebar rhythm.
-->
<script src="data.js?v=8"></script>
<script src="kit.js?v=8"></script>
<script>document.write(`<link rel="stylesheet" href="${EMU.brand.fontsHref}">`)</script>
<style>
  html { scrollbar-gutter: stable; }
  :root { --paper: #F5EFE6; --paper-2: #EFE6D9; --ink: #291605; --ink-2: #70655C; --rule: #DCCFBF; --rust: #9B5212; --rust-d: #6E3A0D; --moss: #3D5A3A; --moss-50: #E6EDE1;
    --serif: 'Newsreader', Georgia, serif; --sans: 'Inter', system-ui, sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--paper); color: var(--ink); font: 400 16px/1.6 var(--sans); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  img { display: block; max-width: 100%; }
  :focus-visible { outline: 2px solid var(--rust); outline-offset: 3px; }
  .sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
  .wrap { max-width: 1240px; margin: 0 auto; padding: 0 20px; }
  @media (min-width: 768px) { .wrap { padding: 0 40px; } }
  header.top .wrap { display: flex; align-items: center; justify-content: space-between; min-height: 72px; }
  .logo { font: 700 22px/1 var(--sans); letter-spacing: -0.03em; text-decoration: none; }
  nav a { text-decoration: none; font-weight: 500; padding: 10px 12px; border-radius: 99px; }
  nav a:hover { background: var(--paper-2); }

  .hero { display: grid; gap: 40px; grid-template-columns: minmax(0, 1fr); padding: 24px 0 72px; align-items: center; }
  @media (min-width: 960px) { .hero { grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 64px; padding-top: 40px; } }
  h1 { font: 400 clamp(44px, 6.4vw, 88px)/0.98 var(--serif); letter-spacing: -0.03em; margin: 0; text-wrap: balance; }
  .ask { margin: 28px 0 0; font: 400 clamp(26px, 3.2vw, 40px)/1.25 var(--serif); color: var(--ink); }
  .ask .slot { display: inline-flex; border-bottom: 2px solid var(--rust); }
  .ask input { font: italic 400 1em/1.2 var(--serif); color: var(--rust); background: transparent; border: 0; width: 8.4em; padding: 0 2px; }
  .ask input::placeholder { color: #A0673A; }
  .go { margin-top: 28px; display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: center; }
  .btn { font: 600 18px var(--sans); min-height: 52px; padding: 0 28px; border-radius: 99px; border: 0; background: var(--rust); color: #fff; cursor: pointer; text-decoration: none; display: inline-flex; align-items: center; }
  .btn:hover { background: var(--rust-d); }
  .go p { margin: 0; color: var(--ink-2); max-width: 30ch; }
  @media (max-width: 560px) { .ask input { width: 100%; } .ask .slot { display: flex; } }

  figure { margin: 0; }
  .photo img { width: 100%; aspect-ratio: 4 / 5; object-fit: cover; object-position: 62% 50%; border-radius: 4px 140px 4px 4px; }
  figcaption, .credit { font-size: 12px; color: var(--ink-2); margin-top: 8px; line-height: 1.4; }
  .photo figcaption em { font: italic 400 18px var(--serif); color: var(--moss); display: block; }

  .places { padding: 64px 0 72px; border-top: 1px solid var(--rule); }
  .places h2, .how h2, .for h2 { font: 400 clamp(30px, 3.4vw, 42px)/1.12 var(--serif); letter-spacing: -0.015em; margin: 0; max-width: 20ch; }
  .places > .wrap > p { margin: 14px 0 0; color: var(--ink-2); max-width: 54ch; font-size: 18px; }
  .spread { display: grid; gap: 28px; margin-top: 40px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 860px) { .spread { grid-template-columns: 1.3fr 1fr 0.8fr; align-items: start; } .spread figure:nth-child(2) { margin-top: 72px; } .spread figure:nth-child(3) { margin-top: 24px; } }
  .spread img { width: 100%; object-fit: cover; border-radius: 4px; }
  .spread figure:nth-child(1) img { aspect-ratio: 4 / 3; }
  .spread figure:nth-child(2) img { aspect-ratio: 1; }
  .spread figure:nth-child(3) img { aspect-ratio: 3 / 4; object-position: 40% 50%; }
  .spread figcaption em { font: italic 400 20px/1.3 var(--serif); color: var(--moss); display: block; margin-bottom: 2px; }

  .lower { display: grid; gap: 56px; padding: 72px 0 88px; border-top: 1px solid var(--rule); grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 960px) { .lower { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 80px; } }
  ol.steps { list-style: none; margin: 28px 0 0; padding: 0; counter-reset: s; }
  ol.steps li { counter-increment: s; display: grid; grid-template-columns: 56px minmax(0, 1fr); gap: 4px 12px; padding: 18px 0; border-top: 1px solid var(--rule); }
  ol.steps li::before { content: counter(s); grid-row: span 2; font: 400 40px/1 var(--serif); color: var(--moss); }
  ol.steps h3 { margin: 0; font: 600 18px var(--sans); }
  ol.steps p { margin: 0; color: var(--ink-2); }
  .for { background: var(--moss-50); border-radius: 4px 4px 120px 4px; padding: 40px; align-self: start; }
  .for h2 { color: var(--moss); }
  .for p { margin: 14px 0 0; font-size: 18px; max-width: 40ch; }
  .for .free { font: italic 400 22px/1.4 var(--serif); color: var(--ink); margin-top: 22px; }
  .for a.line { display: inline-flex; align-items: center; min-height: 44px; margin-top: 18px; font-weight: 600; color: var(--moss); text-underline-offset: 5px; }

  footer.end { border-top: 1px solid var(--rule); padding: 40px 0 56px; color: var(--ink-2); font-size: 14px; }
  footer.end .cols { display: grid; gap: 28px; grid-template-columns: minmax(0, 1fr); }
  @media (min-width: 860px) { footer.end .cols { grid-template-columns: 1fr 1.6fr; } }
  footer.end nav { display: flex; flex-wrap: wrap; gap: 4px 8px; margin-left: -12px; }
  footer.end nav a { font-size: 16px; color: var(--ink); }
  footer.end p { margin: 0 0 10px; max-width: 70ch; }
  footer.end .crisis { color: var(--ink); font-weight: 600; }
</style>
</head>
<body>
<header class="top"><div class="wrap"><a class="logo" href="c1-home.html">emu.</a><nav aria-label="Main"><a href="c1-directory.html">Find a therapist</a><a href="#">For therapists</a></nav></div></header>
<main id="main"></main>
<footer class="end"><div class="wrap cols" id="foot"></div></footer>
<script>
  const { mockBar } = KIT; const H = EMU.home, PH = EMU.photos, B = EMU.brand.images;
  mockBar(1, 'Field notes');
  document.getElementById('main').innerHTML = `
    <section class="wrap hero">
      <div>
        <h1>${H.headline}</h1>
        <form action="c1-directory.html" role="search">
          <p class="ask">Show me therapists who meet near <span class="slot"><label for="loc" class="sr">City or ZIP code</label><input id="loc" name="location" placeholder="your city or ZIP" autocomplete="address-level2"></span></p>
          <div class="go"><button class="btn">Find therapists nearby</button><p>${H.line}</p></div>
        </form>
      </div>
      <figure class="photo">
        <img src="${PH.trailWalk.src}" alt="${PH.trailWalk.alt}">
        <figcaption><em>${PH.trailWalk.place}, a morning walk</em>${PH.trailWalk.credit}</figcaption>
      </figure>
    </section>

    <section class="places" aria-labelledby="h-places">
      <div class="wrap">
        <h2 id="h-places">${H.aboutLine}</h2>
        <p>${H.noOffice}</p>
        <div class="spread">
          <figure><img src="${PH.trailCity.src}" alt="${PH.trailCity.alt}"><figcaption><em>Along a river trail</em>${PH.trailCity.credit}</figcaption></figure>
          <figure><img src="${PH.library.src}" alt="${PH.library.alt}" style="object-position:30% 50%"><figcaption><em>In a quiet corner of a library</em>${PH.library.credit}</figcaption></figure>
          <figure><img src="${B.feather}" alt="A feather caught in warm light"><figcaption><em>${H.walk}</em>Image from emu.care</figcaption></figure>
        </div>
      </div>
    </section>

    <section class="wrap lower">
      <div class="how" aria-labelledby="h-how">
        <h2 id="h-how">How Emu works</h2>
        <ol class="steps">${EMU.howItWorks.map(([t, d]) => `<li><h3>${t}</h3><p>${d}</p></li>`).join('')}</ol>
      </div>
      <aside class="for" aria-labelledby="h-for">
        <h2 id="h-for">${H.therapistsTitle}</h2>
        <p>${H.therapistsLine}</p>
        <p class="free">${H.founding}</p>
        <a class="line" href="#">Join as a therapist</a>
      </aside>
    </section>`;
  document.getElementById('foot').innerHTML = `
    <nav aria-label="Footer"><a href="c1-directory.html">Find a therapist</a><a href="#">About Emu</a><a href="#">For therapists</a><a href="#">Contact</a><a href="#">Privacy</a><a href="#">Terms</a></nav>
    <div><p>${H.disclaimer}</p><p class="crisis">${H.crisis}</p></div>`;
</script>
</body>
</html>
