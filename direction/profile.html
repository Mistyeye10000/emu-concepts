<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">

<title>Jordan Avery | Emu</title>
<!--
  Concept 1, version 2, profile. Rachel's notes (7 Oct): the simplicity of concept 10 without a photo per place and
  with a smaller headshot; concept 8's centred long column, map, sticky booking footer and booking pop-out, with the
  price set large; none of concept 1's crowded three columns. About Me runs 500 to 3,000 characters, so the reading
  column is about 65 characters wide and long bios fold after roughly 1,000 characters.
-->
<script src="data.js?v=9"></script>
<script src="kit.js?v=10"></script>
<script src="map.js?v=15"></script>
<script src="request.js?v=9"></script>
<script src="motion.js?v=2"></script>
<script>document.write(`<link rel="stylesheet" href="${EMU.brand.fontsHref}">`)</script>
<link rel="stylesheet" href="site.css?v=2">
<style>
  /* A light line between the booking bar and the footer, both pine */
  footer.end { border-top: 1px solid rgba(255,255,255,.6); }
  .col { max-width: 760px; margin: 0 auto; padding: 0 20px; }
  .back { display: inline-flex; align-items: center; gap: 6px; min-height: 44px; margin: 8px 0 0 -8px; padding: 0 12px 0 8px; border-radius: 99px; font-weight: 500; text-decoration: none; }
  .back:hover { background: var(--paper-2); }

  /* Two columns on wide screens: who they are on the left, everything else on the right */
  @media (min-width: 960px) {
    .col { max-width: 1160px; }
    .two { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 72px; align-items: start; margin-top: 24px; }
    .main { max-width: 720px; }
    .side .who { grid-template-columns: 1fr; gap: 20px; margin: 16px 0 0; }
    .side .back { margin-top: 0; }
    .side .who img { width: 160px; }
    .side h1 { font-size: 48px; }
    .main .fee { margin-top: 0; }
    .main .sec:first-of-type { padding-top: 56px; }
  }
  /* Pinned only when the whole column fits on screen, so nothing is ever cut off */
  @media (min-width: 960px) and (min-height: 760px) { .side { position: sticky; top: 92px; } }

  /* Header: concept 10's simplicity, smaller headshot */
  .who { display: grid; grid-template-columns: 112px minmax(0, 1fr); gap: 8px 28px; align-items: center; margin: 24px 0 0; }
  @media (max-width: 560px) { .who { grid-template-columns: 84px minmax(0, 1fr); gap: 6px 18px; } }
  .who img { width: 100%; aspect-ratio: 1; border-radius: 50%; object-fit: cover; box-shadow: 0 0 0 4px var(--paper), 0 0 0 5.5px var(--pine); }
  h1 { font: 400 clamp(42px, 6vw, 68px)/1 var(--serif); letter-spacing: -0.025em; margin: 0; }
  .who .cred { margin: 8px 0 0; font-size: 17px; }
  .who .verified { margin-top: 6px; }
  .tags { display: flex; flex-wrap: wrap; gap: 6px; list-style: none; padding: 0; margin: 22px 0 0; }
  .tags li { font-size: 15px; padding: 5px 12px; border-radius: 99px; background: var(--paper-2); }

  .fee { margin: 32px 0 0; padding: 28px; background: var(--card); border: 1px solid var(--rule); border-radius: 4px 56px 4px 4px; display: grid; gap: 18px; }
  @media (min-width: 680px) { .fee { grid-template-columns: minmax(0, 1fr) auto; align-items: end; } }
  .fee .price { margin: 0; display: flex; align-items: baseline; gap: 10px; }
  .fee .price b { font: 400 64px/1 var(--serif); letter-spacing: -0.03em; }
  .fee .price span { font-size: 18px; color: var(--ink-2); }
  .fee ul { list-style: none; margin: 14px 0 0; padding: 0; display: grid; gap: 8px; }
  .fee li { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 8px; align-items: start; }
  .fee li .ic { width: 20px; height: 20px; color: var(--pine); margin-top: 2px; }
  .fee .btn { white-space: nowrap; }

  .sec { padding: 56px 0 0; }
  .sec h2 { font: 400 36px/1.1 var(--serif); letter-spacing: -0.015em; margin: 0 0 16px; }
  .about p { margin: 0; font: 400 21px/1.65 var(--serif); }
  .about .rest { margin-top: 16px; }
  .about .rest[hidden] { display: none; }
  .readmore { margin-top: 14px; font: 600 16px var(--sans); color: var(--rust); background: none; border: 0; padding: 8px 0; min-height: 44px; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
  .note { margin: 10px 0 0; font-size: 14px; color: var(--ink-2); }
  .expect p { margin: 0; font: italic 400 24px/1.5 var(--serif); }

  /* Where you'll meet: a compact list and one map. No photo per place. */
  .spots { list-style: none; margin: 0; padding: 0; display: grid; }
  .spots li { display: block; padding: 20px 12px; margin: 0; border-top: 1px solid var(--rule); border-radius: 4px; transition: background-color .15s; }
  .spots li:last-child { border-bottom: 1px solid var(--rule); }
  .spots li.on { background: var(--paper); }
  /* Choosing a place here carries into booking: Check times opens with it already selected */
  .spots li { position: relative; }
  .spots .nm { padding-right: 132px; }
  .sp-pick { position: absolute; top: 16px; right: 12px; display: inline-flex; align-items: center; gap: 8px; min-height: 40px; padding: 0 14px 0 10px; font: 600 14px var(--sans); color: var(--pine); background: var(--card); border: 1px solid var(--pine); border-radius: 99px; cursor: pointer; transition: background-color .15s, color .15s; }
  .sp-pick:hover { background: var(--pine-50); }
  .sp-pick .tk { width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--pine); display: grid; place-items: center; }
  .sp-pick .tk .ic { width: 11px; height: 11px; visibility: hidden; }
  .sp-pick[aria-pressed="true"] { background: var(--pine); color: #fff; }
  .sp-pick[aria-pressed="true"] .tk { background: #fff; border-color: #fff; color: var(--pine); }
  .sp-pick[aria-pressed="true"] .tk .ic { visibility: visible; }
  .spots li.sel { background: var(--pine-50); box-shadow: inset 3px 0 0 var(--pine); }
  /* Where you'll meet is one contained panel: list and map read as a pair, separate from the sections around it */
  .where { margin-top: 64px; padding: 32px 20px 24px; background: var(--card); border: 1px solid var(--rule); border-radius: 4px 56px 4px 4px; }
  @media (min-width: 760px) { .where { padding: 40px 40px 40px; } }
  .where h2 { font: 400 36px/1.1 var(--serif); letter-spacing: -0.015em; margin: 0 0 12px; }
  .where .spots li:first-child { border-top: 0; }
  .where .spots li:last-child { border-bottom: 0; }
  .where .map { border-radius: 4px 32px 4px 4px; }
  /* Same treatment as the directory rows: pine icon, italic place name */
  .spots .nm { display: flex; gap: 8px; align-items: flex-start; font: italic 400 23px/1.25 var(--serif); color: var(--pine); margin: 0; }
  .spots .nm .ic { width: 22px; height: 22px; margin-top: 4px; flex: none; }
  .spots li > div > :not(.nm) { margin-left: 30px; }
  .spots .kind { margin: 2px 0 6px 30px; font-size: 14px; font-weight: 600; color: var(--pine); }
  .spots .ad { margin: 0; color: var(--ink-2); font-size: 15px; }
  .spots .in { margin: 6px 0 0; font: italic 400 19px/1.45 var(--serif); }
  /* Meeting details fold away, as on the directory's map cards */
  .sp-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s cubic-bezier(.3,.7,.2,1); }
  .sp-more > div { overflow: hidden; min-height: 0; }
  .sp-more.open { grid-template-rows: 1fr; }
  .sp-more.open > div { padding-top: 4px; }
  .sp-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 8px; }
  .sp-foot .dir { margin-top: 0; }
  .sp-tog { display: inline-flex; align-items: center; gap: 4px; font: 600 15px var(--sans); color: var(--rust); background: none; border: 0; min-height: 40px; padding: 0 8px; margin-right: -8px; border-radius: 8px; cursor: pointer; }
  .sp-tog:hover { background: var(--paper-2); }
  .sp-tog svg { width: 14px; height: 14px; transition: transform .2s; }
  .sp-tog[aria-expanded="true"] svg { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .sp-more, .sp-tog svg { transition: none; } }
  .spots .dir { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; min-height: 40px; font-weight: 600; font-size: 15px; color: var(--rust); text-decoration: underline; text-underline-offset: 4px; }
  .spots .dir .ic { width: 18px; height: 18px; }
  .x-place { margin: 10px 0 0; display: grid; gap: 4px; font-size: 15px; }
  .x-place p { margin: 0; }
  /* Places on the left, the map beside them so each place sits next to its pin */
  @media (min-width: 960px) {
    .after { margin-left: 372px; max-width: 720px; }
    /* The map fills its side of the panel, 40px from the top, right and bottom edges, same as the list */
    .wgrid { display: grid; grid-template-columns: minmax(0, 5fr) minmax(0, 6fr); gap: 48px; align-items: stretch; }
    .wmap { display: flex; }
    .wgrid .map { margin-top: 0; height: auto; min-height: 460px; flex: 1; }
  }
  .map { height: 440px; box-shadow: 0 0 0 1px var(--rule); border-radius: 4px 56px 4px 4px; overflow: hidden; margin-top: 20px; position: relative; z-index: 0; background: #ECE7DE; }
  .methods dt { font: 500 21px/1.3 var(--serif); padding-top: 16px; border-top: 1px solid var(--rule); }
  .methods dd { margin: 6px 0 16px; color: var(--ink-2); }
  .x-facts { margin: 0; }
  .x-row { display: grid; grid-template-columns: 160px minmax(0, 1fr); gap: 12px; padding: 12px 0; border-top: 1px solid var(--rule); }
  .x-row dt { font-weight: 600; color: var(--ink-2); }
  .x-row dd { margin: 0; }
  .x-legend { margin: 40px 0 0; }

  /* Sticky booking footer (concept 8), price set large */
  /* Sticks to the bottom of the screen, then settles above the footer when the footer scrolls in */
  .bookbar { position: sticky; bottom: 0; z-index: 40; margin-top: 80px; background: var(--pine); color: #fff; box-shadow: 0 -12px 40px -24px rgba(0,0,0,.5); }
  .bookbar .in2 { max-width: 1240px; margin: 0 auto; padding: 12px 20px; display: flex; align-items: center; gap: 12px 18px; flex-wrap: wrap; }
  @media (min-width: 768px) { .bookbar .in2 { padding: 14px 40px; } }
  .bookbar img { width: 48px; height: 48px; border-radius: 50%; object-fit: cover; }
  .bookbar .who2 { display: grid; line-height: 1.25; }
  .bookbar .who2 b { font: 400 22px var(--serif); }
  .bookbar .who2 span { font-size: 14px; color: #C9D8D1; }
  .bookbar .pr { margin-left: auto; font: 400 30px/1 var(--serif); }
  .bookbar .pr small { font: 400 15px var(--sans); color: #C9D8D1; margin-left: 4px; }
  .bookbar .btn { background: #fff; color: var(--ink); }
  .bookbar .btn:hover { background: var(--lilac); }
  @media (max-width: 560px) { .bookbar .who2 { display: none; } .bookbar .pr { margin-left: 0; font-size: 26px; } .bookbar .btn { margin-left: auto; padding: 0 20px; } }

  /* Booking pop-out (concept 8): four steps */
  /* Booking panel: same treatment as the request form, a floating card 16px in from the top, right and bottom edges */
  dialog.drawer { border: 0; padding: 0; margin: 16px 16px 16px auto; height: calc(100dvh - 32px); max-height: calc(100dvh - 32px); width: min(520px, calc(100vw - 32px)); max-width: calc(100vw - 32px); color: var(--ink); background: var(--paper); border-radius: 20px; overflow: hidden; box-shadow: 0 30px 80px -24px rgba(41,22,5,.45); }
  @media (max-width: 560px) { dialog.drawer { margin: auto 0 0; width: 100vw; max-width: 100vw; height: 92dvh; max-height: 92dvh; border-radius: 20px 20px 0 0; } }
  dialog.drawer[open] { animation: slidein .3s cubic-bezier(.2,.7,.2,1); }
  @keyframes slidein { from { transform: translateX(40px); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { dialog.drawer[open] { animation: none; } }
  dialog.drawer::backdrop { background: rgba(41,22,5,.4); }
  .dr { display: grid; grid-template-rows: auto auto minmax(0, 1fr) auto; height: 100%; }
  .dr header { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; padding: 22px 20px 16px 24px; border-bottom: 1px solid var(--rule); color: var(--ink); }
  .dr header h2 { margin: 0; font: 400 30px/1.1 var(--serif); letter-spacing: -0.01em; }
  .dr header p { margin: 6px 0 0; font-size: 15px; color: var(--ink-2); }
  .dr header .xb { margin-top: -6px; }
  .xb { width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: var(--ink); }
  .xb:hover { background: var(--paper-2); }
  /* Progress: three segments of one trail (the confirmation after sending isn't a step). Finished steps show what was chosen instead of a tick. */
  ol.steps { list-style: none; margin: 0; padding: 16px 24px 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; border-bottom: 1px solid var(--rule); }
  .steps li { display: grid; gap: 2px; align-content: start; min-width: 0; font-size: 13px; color: var(--ink-2); }
  .steps li::before { content: ""; height: 4px; border-radius: 99px; background: var(--rule); margin-bottom: 8px; transition: background-color .25s; }
  .steps li.done::before { background: var(--pine); }
  .steps li[aria-current="step"]::before { background: linear-gradient(90deg, var(--pine) 50%, var(--rule) 50%); }
  .steps li[aria-current="step"] .k { color: var(--ink); font-weight: 600; }
  .steps .v { font: italic 400 15px/1.2 var(--serif); color: var(--pine); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .steps .v:empty { display: none; }
  .pane { overflow-y: auto; padding: 20px 24px 24px; }
  .pane h3 { font: 400 26px/1.2 var(--serif); margin: 0 0 4px; }
  .pane .lead { margin: 0 0 14px; color: var(--ink-2); }
  .dayblk + .dayblk { margin-top: 22px; padding-top: 22px; border-top: 1px solid var(--rule); }
  .dayblk h4 { margin: 0 0 14px; font: 400 21px/1.2 var(--serif); }
  .per { display: grid; grid-template-columns: 84px minmax(0, 1fr); gap: 8px; align-items: start; }
  .per + .per { margin-top: 14px; }
  .per > span { font-size: 14px; color: var(--ink-2); padding-top: 12px; }
  .slots { display: flex; flex-wrap: wrap; gap: 10px 8px; }
  .slot { font: 500 15px var(--sans); font-variant-numeric: tabular-nums; min-height: 44px; padding: 0 16px; border: 1px solid var(--rule); border-radius: 99px; background: var(--card); color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; gap: 4px; transition: border-color .15s, background-color .15s; }
  .slot .ic { width: 14px; height: 14px; display: none; }
  .slot:hover { border-color: var(--pine); }
  .slot[aria-pressed="true"] { background: var(--pine); border-color: var(--pine); color: #fff; font-weight: 600; }
  .slot[aria-pressed="true"] .ic { display: inline; }
  .nowork { margin-top: 22px; padding-top: 16px; border-top: 1px solid var(--rule); }
  .nowork p { margin: 0 0 8px; font-weight: 600; }
  .dr footer { padding: 16px 24px 20px; border-top: 1px solid var(--rule); display: flex; gap: 10px; align-items: center; flex-wrap: wrap; background: var(--paper); }
  .dr footer .sum { flex: 1 1 100%; margin: 0; font-weight: 600; }
  .dr footer .sum:empty { display: none; }
  .dr footer .sum.is-error { color: var(--error); }
  .dr footer .btn { margin-left: auto; }
  .btn2 { font: 600 16px var(--sans); min-height: 52px; padding: 0 22px; border: 1.5px solid var(--ink); border-radius: 99px; background: transparent; color: var(--ink); cursor: pointer; }
  .bookbar .who2 b .ic { width: 18px; height: 18px; margin-right: 6px; vertical-align: -2px; color: #fff; }
  .bookbar.req .who2 { flex: 1; }
  @media (max-width: 560px) { .bookbar.req .who2 { display: grid; } .bookbar.req img { display: none; } }
  .reqd { display: grid; gap: 2px; justify-items: start; padding: 14px 18px; background: var(--pine-50); border-radius: 4px 28px 4px 4px; max-width: 280px; }
  .reqd .h { margin: 0; display: flex; align-items: center; gap: 6px; font: 400 22px/1.2 var(--serif); color: var(--pine); }
  .reqd .h .ic { width: 18px; height: 18px; }
  .reqd p { margin: 0; font-size: 15px; }
  .reqd .again { margin-top: 6px; padding: 6px 0; min-height: 36px; font: 600 15px var(--sans); color: var(--rust); background: none; border: 0; cursor: pointer; text-decoration: underline; text-underline-offset: 4px; }
  .spots .yours { display: inline-block; vertical-align: 1px; margin-left: 10px; font: 600 12px/1 var(--sans); color: #fff; background: var(--pine); border-radius: 99px; padding: 5px 10px; white-space: nowrap; }
  .sentbox { background: var(--pine-50); border-radius: 4px 40px 4px 4px; padding: 18px; margin: 0 0 16px; }
  .sentbox > b { display: flex; align-items: center; gap: 8px; font: 400 26px/1.2 var(--serif); margin-bottom: 14px; color: var(--pine); }
  .sentbox > b .ic { width: 22px; height: 22px; padding: 3px; border-radius: 50%; background: var(--pine); color: #fff; }
  .sentdl { margin: 0; display: grid; gap: 12px; }
  .sentdl > div { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 12px; align-items: start; }
  .sentdl dt { color: var(--pine); padding-top: 2px; }
  .sentdl dt .ic { width: 20px; height: 20px; }

  .sentdl dd b { font-weight: 600; }
  .sentdl dd span { font-size: 15px; color: var(--ink-2); }
  .sentnote { margin: 16px 0 0; padding-top: 14px; border-top: 1px solid rgba(18,48,42,.15); font-size: 15px; color: var(--ink-2); }
  .x-call { background: var(--pine-50); border-radius: 14px; padding: 14px 16px; display: grid; gap: 2px; margin: 0 0 16px; }
  .x-call b { color: var(--pine); font-weight: 600; }
  .x-call span { font-size: 14px; color: var(--ink-2); }
  .x-notice { margin: 0 0 14px; color: var(--ink-2); }
  .x-h { font-weight: 600; font-size: 15px; margin: 0 0 6px; }
  .x-next ol { margin: 0; padding-left: 20px; color: var(--ink-2); }
  .x-ask { font: 600 15px var(--sans); min-height: 46px; width: 100%; padding: 0 14px; border: 1.5px dashed #877A6E; background: transparent; border-radius: 99px; color: var(--ink); cursor: pointer; display: inline-flex; align-items: center; justify-content: center; gap: 8px; }
  .x-prop { font-size: 12px; font-weight: 600; color: var(--ink-2); border: 1px solid #877A6E; border-radius: 99px; padding: 1px 7px; }
  .x-note { font-size: 14px; color: var(--ink-2); margin: 6px 0 0; }
  .x-picker .x-h { display: none; }
  .x-locs { display: grid; gap: 8px; }

  .x-loc:hover { border-color: var(--pine); }
  .x-loc small { display: block; font-size: 13px; color: var(--ink-2); font-weight: 400; }

  :root { --rq-ink:#291605;--rq-soft:#6B6056;--rq-bg:#F5EFE6;--rq-panel:#E3EBE5;--rq-line:#DCCFBF;--rq-accent:#9B5212;--rq-accent-hover:#6E3A0D;--rq-radius:20px;--rq-btn-radius:99px;--rq-title-font:400 30px/1.1 'Newsreader',Georgia,serif;--rq-sans:'Inter',system-ui,sans-serif; }

<body>
<div class="navwrap"><nav class="pillnav" aria-label="Main"><a class="logo" href="index.html">emu.</a><a class="l" href="index.html#how">How it works</a><a class="l" href="index.html#therapists">For therapists</a><a class="find" href="directory.html">Find a therapist</a></nav></div>
<main class="under-nav"><article class="col" id="art"></article></main>
<dialog class="drawer" id="drawer" aria-labelledby="dr-t">
  <div class="dr">
    <header><div><h2 id="dr-t">Book with Jordan</h2><p id="dr-sub"></p></div><button class="xb" id="drx" aria-label="Close booking"></button></header>
    <ol class="steps" id="steps"><li data-s="1"><span class="k">Place</span><span class="v"></span></li><li data-s="2"><span class="k">Time</span><span class="v"></span></li><li data-s="3"><span class="k">Your details</span><span class="v"></span></li></ol>
    <div class="pane" id="pane"></div>
    <footer id="dfoot"></footer>
  </div>
</dialog>
<div class="bookbar" role="region" aria-label="Book with Jordan"><div class="in2" id="bar"></div></div>
<footer class="end"><div class="wrap cols" id="foot"></div></footer>
<script>
  const { icon, placeIcon, PLACE_TYPES, fullSlot, facts, freeCall, whatNext, contact, legend, notice, payLine, locPicker, wireLocs, mountLocMap, placeMore, exm } = KIT;
  const j = EMU.therapists[0], P = EMU.profile, X = EMU.extras, L = P.locations, H = EMU.home;

  // About Me folds after roughly 1,000 characters (bios run 500 to 3,000)
  const FOLD = 1000, paras = P.about.split(/\n+/);
  let shown = [], rest = [], n = 0;
  paras.forEach(p => { (n < FOLD ? shown : rest).push(p); n += p.length; });

  document.getElementById('art').innerHTML = `
    <div class="two"><aside class="side">
    <a class="back" href="directory.html">${icon('left')}Back to your search</a>
    <div class="who rv"><img src="${j.photo}" alt="Portrait of ${j.name}"><div><h1>${j.name}</h1><p class="cred">${j.credential}, ${j.city}</p><span class="verified">${icon('badge')}License verified in ${j.state}</span></div></div>
    <ul class="tags rv" data-d="1" aria-label="${EMU.labels.focus}">${j.specialties.map(s => `<li>${s}</li>`).join('')}</ul>
    </aside><div class="main">
    <div class="fee rv" data-d="2">
      <div><p class="price"><b>$${j.price}</b><span>per session</span></p>
        <ul><li>${icon('check')}<span>${X.notice.text}</span></li><li>${icon('check')}<span>${X.freeCall.text}${exm}</span></li><li>${icon('check')}<span>${X.payment.text}</span></li></ul></div>
      <div id="feecta"><button class="btn" type="button" data-book>Check times</button></div>
    </div>
    <section class="sec about" aria-labelledby="h-about"><h2 id="h-about" class="rv">About me</h2>
      ${shown.map(p => `<p class="rv">${p}</p>`).join('')}
      ${rest.length ? `<div class="rest" id="rest" hidden>${rest.map(p => `<p>${p}</p>`).join('')}</div><button class="readmore" type="button" aria-expanded="false" aria-controls="rest" id="readmore">Read more</button>` : ''}
      <p class="note">Therapists write 500 to 3,000 characters here. Longer bios fold after the first part.</p>
    </section>
    <section class="sec expect" aria-labelledby="h-exp"><h2 id="h-exp" class="rv">What you can expect</h2><p class="rv">${P.expect}</p></section>
    </div></div>
    <section class="where" aria-labelledby="h-where">
      <div class="wgrid"><div class="wlist"><h2 id="h-where" class="rv">Where you'll meet</h2><ol class="spots rv">${L.map((l, i) => `<li data-spot="${i + 1}" data-id="${l.id}"${i === 0 ? ' class="sel"' : ''}><button type="button" class="sp-pick" aria-pressed="${i === 0}"><span class="tk" aria-hidden="true">${icon('check')}</span><span class="lb">${i === 0 ? 'Selected' : 'Meet here'}</span><span class="sr"> ${l.name}</span></button><div>
        <p class="nm">${icon(placeIcon(l.type))}<span>${l.name}${l.example ? exm : ''}</span></p>
        <p class="kind">${l.type} <span aria-hidden="true">&middot;</span> ${PLACE_TYPES[l.type].setting}</p>
        <p class="ad">${l.address}</p>
        <div class="sp-more" id="sp-${i + 1}"><div inert><p class="in">${l.instructions}${l.example ? exm : ''}</p>${i === 0 ? placeMore() : ''}</div></div>
        <div class="sp-foot"><a class="dir" href="https://www.google.com/maps/dir/?api=1&destination=${encodeURIComponent(l.address)}" target="_blank" rel="noopener">${icon('route')}Get directions<span class="sr"> to ${l.name} (opens Google Maps)</span></a><button type="button" class="sp-tog" aria-expanded="false" aria-controls="sp-${i + 1}"><span>More</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div></div></li>`).join('')}</ol></div>
      <div class="wmap"><div class="map rv" id="locmap" role="region" aria-label="Map of Jordan's three meeting places"></div></div></div>
    </section>
    <div class="after">
    <section class="sec methods" aria-labelledby="h-m"><h2 id="h-m" class="rv">${EMU.labels.approaches}</h2><dl class="rv">${P.methods.map(([nm, d]) => `<dt>${nm}</dt><dd>${d}</dd>`).join('')}</dl></section>
    <section class="sec" aria-labelledby="h-g"><h2 id="h-g" class="rv">Good to know</h2><div class="rv">${facts()}</div></section>
    ${legend()}
    </div></div>`;
  const rm = document.getElementById('readmore');
  if (rm) rm.onclick = () => { const r = document.getElementById('rest'), open = r.hidden; r.hidden = !open; rm.setAttribute('aria-expanded', open); rm.textContent = open ? 'Show less' : 'Read more'; };
  document.querySelectorAll('.sp-tog').forEach(b => b.onclick = () => {
    const open = b.getAttribute('aria-expanded') !== 'true', m = document.getElementById(b.getAttribute('aria-controls'));
    b.setAttribute('aria-expanded', open); b.firstElementChild.textContent = open ? 'Less' : 'More'; m.classList.toggle('open', open); m.firstElementChild.inert = !open;
  });
  // Map: place-type pins with name bubbles. The list and the pins highlight each other.
  const spot = (n, scroll) => { document.querySelectorAll('.spots li').forEach(li => li.classList.toggle('on', li.dataset.spot === String(n))); if (scroll) document.querySelector(`.spots li[data-spot="${n}"]`).scrollIntoView({ behavior: MOTION.reduce ? 'auto' : 'smooth', block: 'center' }); };
  mountLocMap(document.getElementById('locmap'), { tiles: 'streets', typeIcons: true, bubble: true, noNumbers: true, tint: 'saturate(.75) sepia(.12) brightness(1.02)', onPin: (n, click) => { spot(n, click); if (window.__locMap) window.__locMap.focus(n); } });
  // The map stretches with the list (More opens details), so redraw it when its size changes
  if (window.ResizeObserver) new ResizeObserver(() => window.__locMap && window.__locMap.map.invalidateSize()).observe(document.getElementById('locmap'));
  document.querySelectorAll('.spots li').forEach(li => ['mouseenter', 'focusin'].forEach(ev => li.addEventListener(ev, () => { spot(li.dataset.spot); if (window.__locMap) window.__locMap.focus(li.dataset.spot); })));

  document.getElementById('bar').innerHTML = `<img src="${j.photo}" alt=""><span class="who2"><b>${j.name}</b><span>${X.notice.text}</span></span><span class="pr">$${j.price}<small>per session</small></span><button class="btn" type="button" data-book>Check times</button>`;
  document.getElementById('foot').innerHTML = `
    <div><a class="logo" href="index.html">emu.</a><nav aria-label="Footer"><a href="directory.html">Find a therapist</a><a href="#">About Emu</a><a href="index.html#therapists">For therapists</a><a href="#">Privacy</a><a href="#">Terms</a></nav></div>
    <div><p>${H.disclaimer}</p><p class="crisis">${H.crisis}</p></div>`;

  // Booking pop-out: Place, Time, Your details, Sent
  const drawer = document.getElementById('drawer'), pane = document.getElementById('pane'), dfoot = document.getElementById('dfoot');
  document.getElementById('drx').innerHTML = icon('x');
  document.getElementById('dr-sub').textContent = `$${j.price} per session. ${X.notice.text}`;
  document.getElementById('drx').onclick = () => drawer.close();
  drawer.addEventListener('click', e => { if (e.target === drawer) drawer.close(); });
  const slot = (d, t) => `<button class="slot" aria-pressed="false" data-t="${fullSlot(d, t)}">${icon('check')}${t}</button>`;
  const per = (lab, d, ts) => ts.length ? `<div class="per"><span>${lab}</span><div class="slots" role="group" aria-label="${d}, ${lab.toLowerCase()}">${ts.map(t => slot(d, t)).join('')}</div></div>` : '';
  const daysHTML = av => av.map(d => `<div class="dayblk"><h4>${d.day}</h4>${per('Morning', d.day, d.morning)}${per('Afternoon', d.day, d.afternoon)}</div>`).join('');
  pane.innerHTML = `
    <section data-p="1"><h3>Where would you like to meet?</h3><p class="lead">Jordan meets at three places. Times depend on the place.</p>${freeCall()}${locPicker()}</section>
    <section data-p="2" hidden><h3 id="h-time"></h3>${notice()}<div data-days></div><div class="nowork"><p>None of these times work?</p>${contact()}</div></section>
    <section data-p="3" hidden><h3>Your details</h3><div id="rqbox"></div></section>
    <section data-p="4" hidden><div class="sentbox"><b>${icon('check')}Request sent</b><div id="sentline"></div></div>${whatNext()}<p class="lead" style="margin-top:14px">${payLine()}</p></section>`;
  const root = drawer; let step = 1, picked = null;
  root.__resetPick = () => { picked = null; };
  wireLocs(root, daysHTML);
  const loc = () => L.find(l => l.name === root.dataset.loc);
  // The stepper shows each choice as soon as it's made: the place from the start, the time once picked
  const shortTime = t => (t || '').replace(/^(\w{3})\w*, (\w{3})\w* (\d+) at /, '$1, $2 $3, ').replace(/ \(.*\)$/, '');
  const paintVals = () => {
    const l = loc(); const vals = { 1: l ? (l.short || l.name) : root.dataset.loc, 2: shortTime(picked), 3: step === 4 ? 'Details sent' : '' };
    document.querySelectorAll('#steps li').forEach(li => { li.querySelector('.v').textContent = vals[li.dataset.s] || ''; });
  };
  function go(nx) {
    step = nx;
    pane.querySelectorAll('section').forEach(s => s.hidden = +s.dataset.p !== nx);
    paintVals();
    document.querySelectorAll('#steps li').forEach(li => { const s = +li.dataset.s; li.classList.toggle('done', s < nx); if (s === nx) li.setAttribute('aria-current', 'step'); else li.removeAttribute('aria-current'); });
    if (nx === 2) document.getElementById('h-time').textContent = `Times at ${root.dataset.loc}`;
    dfoot.innerHTML = nx === 1 ? `<button class="btn" id="next">Choose a time</button>`
      : nx === 2 ? `<p class="sum is-error" aria-live="polite"></p><button class="btn2" id="prev">Back</button><button class="btn" id="next">Continue</button>`
      : nx === 3 ? `<button class="btn2" id="prev">Back</button><button class="btn" id="next">${EMU.request.send}</button>`
      : `<button class="btn2" id="again">Request another time</button><button class="btn" id="done">Done</button>`;
    pane.scrollTop = 0;
    const h = pane.querySelector(`section[data-p="${nx}"] h3`); if (h) { h.tabIndex = -1; h.focus(); }
  }
  // Your details: the request form sits inside this panel, not in a separate window. The footer button sends it.
  let form = null;
  const showForm = () => {
    form = EMU_REQ.inline(document.getElementById('rqbox'), { therapist: j, when: picked, place: root.dataset.loc, address: loc().address,
      onSending: () => { const b = document.getElementById('next'); if (b) { b.disabled = true; b.textContent = 'Sending request…'; } },
      onDone: () => sent(`${picked} at ${root.dataset.loc}`) });
  };
  // After sending, the profile shows the pending request (this visit only) so nobody wonders whether it went through
  let request = null;
  function sent(what) {
    const l = loc(); request = { when: picked, id: l.id, place: l.name, short: shortTime(picked) };
    const [day, time] = (picked || '').split(' at ');
    document.getElementById('sentline').innerHTML = `<dl class="sentdl">
        <div><dt>${icon('cal')}<span class="sr">When</span></dt><dd><b>${day}</b><span>${time}${X.timezone ? ` (${X.timezone})` : ''}</span></dd></div>
        <div><dt>${icon(placeIcon(l.type))}<span class="sr">Where</span></dt><dd><b>${l.name}</b><span>${l.address}</span></dd></div>
      </dl>
      <p class="sentnote">Jordan will reply by email. Your appointment is confirmed only when Jordan accepts.</p>`;
    go(4); markRequested();
  }
  function markRequested() {
    const line = `${request.short} at ${request.place}`;
    document.querySelector('.bookbar').classList.add('req');
    document.getElementById('bar').innerHTML = `<img src="${j.photo}" alt=""><span class="who2"><b>${icon('check')}Request sent</b><span>${line}. Jordan will reply by email.</span></span><button class="btn" type="button" data-book data-view>View request</button>`;
    document.getElementById('feecta').innerHTML = `<div class="reqd"><p class="h">${icon('check')}Request sent</p><p>${line}</p><button type="button" class="again" data-book data-again>Request another time</button></div>`;
    document.querySelectorAll('.spots li').forEach(li => { li.querySelector('.yours')?.remove(); if (li.dataset.id === request.id) li.querySelector('.kind').insertAdjacentHTML('beforeend', '<span class="yours">Your request</span>'); });
  }
  dfoot.addEventListener('click', e => {
    if (e.target.id === 'prev') go(step - 1);
    if (e.target.id === 'done') drawer.close();
    if (e.target.id === 'again') startOver();
    if (e.target.id !== 'next') return;
    if (step === 1) go(2);
    else if (step === 2) { if (!picked) { dfoot.querySelector('.sum').textContent = 'Choose a time to continue'; pane.querySelector('.slot')?.focus(); return; } showForm(); go(3); }
    else if (step === 3) form.submit();
  });
  pane.addEventListener('click', e => {
    const s = e.target.closest('[data-t]'); if (!s) return;
    pane.querySelectorAll('[data-t]').forEach(x => x.setAttribute('aria-pressed', x === s));
    picked = s.dataset.t; const sum = dfoot.querySelector('.sum'); if (sum) sum.textContent = ''; paintVals();
  });
  root.addEventListener('click', e => { if (e.target.closest('.x-loc')) paintVals(); });
  // "See more available dates" finishes the request itself; follow it to step 4
  pane.addEventListener('click', e => {
    if (!e.target.closest('.x-moredates')) return;
    const d = document.querySelector('dialog.rq'); if (!d) return;
    const obs = new MutationObserver(() => { const h = d.querySelector('h2'); if (h && h.textContent === EMU.request.sentTitle) { const sm = d.querySelector('.rq-sum span:last-child'); obs.disconnect(); sent(`${sm ? sm.textContent.replace(/ \(Eastern Time\)$/, '') : 'Your chosen time'} at ${root.dataset.loc}`); } });
    obs.observe(d, { childList: true, subtree: true });
  });
  // The place chosen in "Where you'll meet" is preselected when booking opens, and a change in the drawer flows back
  let chosen = L[0].id, chosenByUser = false;
  const choose = (id, fromPage) => {
    chosen = id; if (fromPage) chosenByUser = true;
    document.querySelectorAll('.spots li').forEach(li => { const on = li.dataset.id === id; li.classList.toggle('sel', on); const b = li.querySelector('.sp-pick'); b.setAttribute('aria-pressed', on); b.querySelector('.lb').textContent = on ? 'Selected' : 'Meet here'; });
    if (window.__locMap) window.__locMap.focus(L.findIndex(l => l.id === id) + 1);
  };
  document.querySelectorAll('.sp-pick').forEach(b => b.onclick = () => choose(b.closest('li').dataset.id, true));
  root.addEventListener('click', e => { const b = e.target.closest('.x-loc'); if (b) choose(b.dataset.loc); });
  const startOver = () => { picked = null; go(1); };
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-book]'); if (!t) return;
    // View request: open on the pending request's confirmation
    if (request && t.hasAttribute('data-view')) {
      const b = root.querySelector(`.x-loc[data-loc="${request.id}"]`); if (b && b.getAttribute('aria-pressed') !== 'true') b.click();
      picked = request.when; go(4); drawer.showModal(); return;
    }
    picked = null;
    go(1);
    const b = root.querySelector(`.x-loc[data-loc="${chosen}"]`); if (b && b.getAttribute('aria-pressed') !== 'true') b.click();
    const hint = root.querySelector('.x-hint-line'); if (hint && chosenByUser) hint.textContent = "The place you chose on Jordan's profile is selected. Times below are for this place.";
    paintVals();
    drawer.showModal();
  });
  if (new URLSearchParams(location.search).get('book')) { go(1); drawer.showModal(); }
  MOTION.watch();
</script>
</body>
</html>
