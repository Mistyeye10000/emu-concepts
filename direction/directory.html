<link rel="stylesheet" href="site.css?v=2">
<style>
  .lede { padding: 24px 0 36px; }
  .sentence { font: 400 clamp(30px, 4.4vw, 52px)/1.18 var(--serif); letter-spacing: -0.015em; margin: 0; text-wrap: balance; }
  .sentence .slot { display: inline-flex; align-items: baseline; border-bottom: 2px solid var(--rust); padding: 0 2px; max-width: 100%; }
  .sentence input, .sentence select { font: italic 400 1em/1.1 var(--serif); color: var(--rust); background: transparent; border: 0; padding: 0; }
  .sentence input { width: 7.6em; min-width: 0; max-width: 100%; }
  /* Focus: the underline thickens and the field gets a soft tint, instead of a box */
  .sentence .slot { border-radius: 6px 6px 0 0; transition: background-color .15s; }
  .sentence .slot:focus-within { background: var(--paper-2); box-shadow: inset 0 -2px 0 var(--rust); }
  .sentence input:focus-visible, .sentence .dd > button:focus-visible { outline: none; }
  /* Distance: a custom menu, because the native one is drawn at the sentence's 52px size */
  .dd { position: relative; display: inline-flex; }
  .dd > button { font: italic 400 1em/1.1 var(--serif); color: var(--rust); background: none; border: 0; padding: 0 2px 0 0; cursor: pointer; display: inline-flex; align-items: baseline; gap: .12em; letter-spacing: inherit; }
  .dd > button svg { width: .42em; height: .42em; align-self: center; transition: transform .15s; }
  .dd > button[aria-expanded="true"] svg { transform: rotate(180deg); }
  .dd .menu { display: block; position: absolute; top: calc(100% + 8px); left: 0; z-index: 20; list-style: none; margin: 0; padding: 6px; min-width: 160px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; box-shadow: 0 18px 40px -18px rgba(41,22,5,.4); font: 400 16px/1.2 var(--sans); letter-spacing: 0; color: var(--ink); }
  .dd .menu[hidden] { display: none; }
  .dd [role=option] { display: flex; align-items: center; gap: 10px; min-height: 40px; padding: 0 12px; border-radius: 9px; cursor: pointer; white-space: nowrap; }
  .dd [role=option] .ic { width: 16px; height: 16px; color: var(--pine); visibility: hidden; }
  .dd [role=option][aria-selected="true"] { font-weight: 600; }
  .dd [role=option][aria-selected="true"] .ic { visibility: visible; }
  /* Pagination and results per page */
  .pager { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 16px 24px; padding-top: 28px; }
  .pp { display: inline-flex; align-items: center; gap: 12px; color: var(--ink-2); font-size: 15px; }
  .pp .dd > button { font: 600 15px var(--sans); color: var(--ink); border: 1px solid var(--ink-2); border-radius: 99px; min-height: 40px; padding: 0 12px 0 16px; align-items: center; gap: 8px; }
  .pp .dd > button svg { width: 14px; height: 14px; }
  .pp .dd .menu { min-width: 100px; top: auto; bottom: calc(100% + 8px); }
  .pages { display: flex; align-items: center; gap: 6px; }
  .pages button { font: 600 15px var(--sans); color: var(--ink); background: none; border: 0; min-height: 44px; cursor: pointer; border-radius: 99px; }
  .pages .pnum { width: 44px; }
  .pages .pnum:hover, .pages .pn:hover:not(:disabled) { background: var(--paper-2); }
  .pages .pnum[aria-current="page"] { background: var(--pine); color: #fff; }
  .pages .pn { display: inline-flex; align-items: center; gap: 4px; padding: 0 12px; }
  .pages .pn .ic { width: 16px; height: 16px; }
  .pages .pn:disabled { color: var(--ink-2); opacity: .5; cursor: default; }
  .dd [role=option]:hover, .dd [role=option].act { background: var(--paper-2); }
  .lede p.meta { margin: 16px 0 0; color: var(--ink-2); }

  .bar { display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: center; padding-bottom: 16px; border-bottom: 2px solid var(--ink); }
  .bar .count { font: 500 16px var(--sans); }
  .chip { display: inline-flex; align-items: center; gap: 6px; font: 600 14px var(--sans); color: var(--pine); background: var(--pine-50); border: 1px solid var(--pine); border-radius: 99px; min-height: 34px; padding: 0 8px 0 12px; cursor: pointer; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chips:empty { display: none; }
  .chip .ic { width: 14px; height: 14px; }
  /* The Filters button only appears where the sidebar doesn't: map view and narrow screens */
  @media (min-width: 1000px) { body:not(.mapmode) .fbtn { display: none; } }
  .fbtn { display: inline-flex; align-items: center; gap: 8px; font: 600 15px var(--sans); color: var(--ink); background: transparent; border: 1px solid var(--ink-2); border-radius: 99px; min-height: 40px; padding: 0 16px; cursor: pointer; }
  .view { margin-left: auto; display: inline-flex; background: var(--paper-2); border-radius: 99px; padding: 4px; }
  .view button { font: 600 14px var(--sans); color: var(--ink-2); background: none; border: 0; min-height: 38px; padding: 0 16px; display: inline-flex; align-items: center; gap: 6px; border-radius: 99px; cursor: pointer; transition: background-color .15s, color .15s; }
  .view button[aria-pressed="true"] { background: var(--pine); color: #fff; }
  /* With script, the pressed colour comes from a sliding thumb instead */
  .view { position: relative; }
  .view .thumb { position: absolute; left: 0; top: 4px; bottom: 4px; border-radius: 99px; background: var(--pine); transition: transform .22s cubic-bezier(.3,.7,.2,1), width .22s cubic-bezier(.3,.7,.2,1); }
  .view .thumb.nomo { transition: none; }
  .view .thumb ~ button { position: relative; z-index: 1; transition: color .22s; }
  .view .thumb ~ button[aria-pressed="true"] { background: transparent; }
  @media (prefers-reduced-motion: reduce) { .view .thumb, .view .thumb ~ button { transition: none; } }

  /* List view (concept 1) */
  .lcols { display: grid; gap: 40px; grid-template-columns: minmax(0, 1fr); padding: 24px 0 64px; }
  @media (min-width: 1000px) { .lcols { grid-template-columns: 240px minmax(0, 1fr); gap: 56px; } }
  aside.filters { align-self: start; }
  @media (max-width: 999px) { aside.filters { display: none; } }
  .fhead { display: flex; justify-content: space-between; align-items: center; min-height: 48px; }
  .fhead h2 { margin: 0; font: 500 16px var(--sans); }
  .clr { font: 600 15px var(--sans); color: var(--rust); background: none; border: 0; padding: 0 4px; margin-right: -4px; min-height: 40px; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }
  .clr[hidden] { display: none; }
  .groups details { border-top: 1px solid var(--rule); }
  .groups details:last-child { border-bottom: 1px solid var(--rule); }
  .groups summary { list-style: none; cursor: pointer; display: flex; justify-content: space-between; align-items: center; min-height: 48px; font-weight: 600; }
  .groups summary::-webkit-details-marker { display: none; }
  .groups summary::after { content: "+"; font: 400 22px/1 var(--serif); color: var(--ink-2); }
  .groups details[open] summary::after { content: "\2212"; }
  .groups .opts { display: grid; gap: 2px; padding: 0 0 14px; }
  .opt { display: flex; align-items: center; gap: 10px; min-height: 36px; font: 400 16px var(--sans); color: var(--ink); background: none; border: 0; padding: 0 8px; margin: 0 -8px; border-radius: 8px; cursor: pointer; text-align: left; }
  .opt:hover { background: var(--paper-2); }
  .opt .box { width: 18px; height: 18px; border: 1.5px solid var(--ink-2); border-radius: 50%; display: grid; place-items: center; flex: none; }
  .opt .box .ic { width: 12px; height: 12px; display: none; color: #fff; }
  .opt[aria-pressed="true"] { font-weight: 600; }
  .opt[aria-pressed="true"] .box { background: var(--pine); border-color: var(--pine); }
  .opt[aria-pressed="true"] .box .ic { display: block; }
  ol.results { list-style: none; margin: 0; padding: 0; }
  .row { position: relative; display: grid; gap: 20px 32px; grid-template-columns: minmax(0, 1fr); padding: 32px 0; border-bottom: 1px solid var(--rule); }
  @media (min-width: 760px) { .row { grid-template-columns: minmax(0, 1fr) 170px; align-items: start; } .row .place { grid-column: 1; grid-row: 1; } .row .person { grid-column: 1; grid-row: 2; } .row .tail { grid-column: 2; grid-row: 1 / 3; } }
  @media (min-width: 1240px) { .row { grid-template-columns: 210px minmax(0, 1fr) 170px; } .row .place, .row .person, .row .tail { grid-row: 1; } .row .place { grid-column: 1; } .row .person { grid-column: 2; } .row .tail { grid-column: 3; } }
  .row:hover .name a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 5px; }
  .place { display: grid; gap: 4px; align-content: start; }
  .place .where { display: flex; gap: 8px; align-items: flex-start; font: italic 400 21px/1.25 var(--serif); color: var(--pine); }
  .place .where .ic { width: 22px; height: 22px; margin-top: 2px; }
  .place .sub { font-size: 14px; color: var(--ink-2); padding-left: 30px; }
  .person { display: grid; grid-template-columns: 72px minmax(0, 1fr); gap: 18px; align-items: start; }
  .person img { width: 72px; height: 72px; border-radius: 50%; object-fit: cover; }
  .name { font: 500 30px/1.12 var(--serif); letter-spacing: -0.01em; margin: 0; }
  .name a { text-decoration: none; }
  .name a::after { content: ""; position: absolute; inset: 0; }
  .cred { margin: 4px 0 0; }
  .verified { margin-top: 6px; }
  .spec { margin: 12px 0 0; color: var(--ink-2); }
  .spec b { color: var(--ink); font-weight: 500; }
  .tail { display: grid; gap: 4px; align-content: start; }
  @media (min-width: 760px) { .tail { text-align: right; justify-items: end; } }
  .tail .price { font: 500 28px/1.1 var(--serif); }
  .tail .per { font-size: 14px; color: var(--ink-2); }
  .tail .next { margin-top: 10px; font-size: 14px; }
  .tail .go { margin-top: 10px; display: inline-flex; align-items: center; gap: 4px; font: 600 16px var(--sans); color: var(--rust); }

  /* Map view: full screen, results beside the map */
  /* Map view: a full-screen layer over the page. The list underneath keeps its place. */
  .stage { position: fixed; inset: 0; z-index: 80; display: grid; grid-template-rows: minmax(0, 1fr); background: var(--paper); }
  .stage[hidden] { display: none; }
  html.maplock { overflow: hidden; }
  .mfil { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding-bottom: 14px; margin-bottom: 14px; border-bottom: 1px solid var(--rule); }
  /* The search sentence moves into the panel in map view, set smaller */
  .msearch { margin: 0 0 28px; }
  .msearch .sentence { font-size: 28px; line-height: 1.3; display: grid; grid-template-columns: minmax(0, 1fr) auto; column-gap: 20px; align-items: end; }
  .msearch .lead { grid-column: 1 / -1; margin-bottom: 10px; }
  .msearch .w { font: 400 15px/1.2 var(--sans); color: var(--ink-2); letter-spacing: 0; grid-row: 2; margin-bottom: 2px; }
  .msearch .w1, .msearch .s1 { grid-column: 1; }
  .msearch .w2, .msearch .s2 { grid-column: 2; }
  .msearch .slot { grid-row: 3; }
  .msearch .s1 input { width: 100%; }
  .mapwrap { position: relative; min-height: 0; }
  /* The List/Map toggle floats on the map, top right */
  #mview { position: absolute; top: 14px; right: 14px; z-index: 500; }
  #mview .view { background: var(--card); box-shadow: 0 10px 28px -12px rgba(41,22,5,.45); }
  .mbody { display: grid; min-height: 0; }
  @media (min-width: 900px) { .mbody { grid-template-columns: 460px minmax(0, 1fr); } }
  .stage .panel { overflow-y: auto; background: var(--paper); padding: 18px 20px 24px; border-right: 1px solid var(--rule); }
  .stage .x-map { height: 100%; position: relative; z-index: 0; background: #ECE7DE; }
  @media (max-width: 899px) { .mbody { grid-template-rows: 55% minmax(0, 1fr); } .stage .mapwrap { order: -1; } .stage .panel { border-right: 0; border-top: 1px solid var(--rule); } }
  .x-mapcount { margin: 0 0 12px; font: 500 15px var(--sans); color: var(--ink-2); }
  .mlist { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
  /* Map cards: a compact version of the list row, so nothing is lost when switching views */
  .mlist li { position: relative; display: grid; gap: 12px; padding: 16px 16px 16px 16px; background: var(--card); border: 1px solid var(--rule); border-radius: 14px; transition: border-color .15s, box-shadow .15s; }
  .mlist li:hover, .mlist li:focus-within { border-color: var(--pine); box-shadow: 0 10px 24px -16px rgba(18,48,42,.5); }
  .mc-top { display: grid; grid-template-columns: 56px minmax(0, 1fr) auto; gap: 14px; align-items: start; }
  .mlist img { width: 56px; height: 56px; border-radius: 50%; object-fit: cover; }
  .mc-id { display: grid; gap: 2px; }
  .mlist .nm { font: 500 22px/1.15 var(--serif); }
  .mlist .nm a { text-decoration: none; }
  .mlist .nm a::after { content: ""; position: absolute; inset: 0; }
  .mlist li:hover .nm a { text-decoration: underline; text-decoration-thickness: 1px; text-underline-offset: 4px; }
  .mc-id .cr { font-size: 14px; }
  .mc-id .verified { margin-top: 2px; font-size: 13px; }
  .mlist .pr { text-align: right; font: 500 22px/1.1 var(--serif); }
  .mlist .pr small { display: block; margin-top: 2px; font: 400 13px var(--sans); color: var(--ink-2); }
  .mc-body { display: grid; gap: 8px; padding-left: 70px; font-size: 14px; }
  .mc-body .pl { display: flex; gap: 6px; align-items: flex-start; font: italic 400 17px/1.25 var(--serif); color: var(--pine); }
  .mc-body .pl .ic { width: 20px; height: 20px; margin-top: 1px; flex: none; }
  .mc-body .pl small { display: block; font: 400 13px var(--sans); color: var(--ink-2); margin-top: 2px; }
  .mc-body .x-about { margin: 0; font-size: 14px; color: var(--ink-2); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .mc-body .spec { margin: 0; color: var(--ink-2); }
  .mc-body .spec b { color: var(--ink); font-weight: 500; }
  .mc-body .x-hints { margin: 0; }
  .mc-body .x-hint { font-size: 13px; }
  .mc-body .next { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding-top: 6px; border-top: 1px solid var(--rule); color: var(--ink); }
  /* Details fold away so each card stays short; More opens them in place */
  .mc-more { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .25s cubic-bezier(.3,.7,.2,1); }
  .mc-more > div { overflow: hidden; display: grid; gap: 8px; min-height: 0; }
  .mc-more.open { grid-template-rows: 1fr; }
  .mc-body:has(.mc-more:not(.open)) { row-gap: 0; }
  .mc-body:has(.mc-more:not(.open)) .pl { margin-bottom: 10px; }
  .mc-more.open > div { padding-bottom: 4px; }
  .mc-tog { position: relative; z-index: 1; display: inline-flex; align-items: center; gap: 4px; font: 600 14px var(--sans); color: var(--rust); background: none; border: 0; min-height: 36px; padding: 0 6px; margin-right: -6px; border-radius: 8px; cursor: pointer; }
  .mc-tog:hover { background: var(--paper-2); }
  .mc-tog svg { width: 14px; height: 14px; transition: transform .2s; }
  .mc-tog[aria-expanded="true"] svg { transform: rotate(180deg); }
  @media (prefers-reduced-motion: reduce) { .mc-more, .mc-tog svg { transition: none; } }
  .mlist .n { position: absolute; left: 6px; top: 6px; width: 22px; height: 22px; border-radius: 50%; background: var(--pine); color: #fff; font: 700 12px/22px var(--sans); text-align: center; }

  dialog.f { border: 0; padding: 0; width: min(520px, 100vw); max-height: 88dvh; border-radius: 20px; background: var(--paper); color: var(--ink); box-shadow: 0 30px 80px -20px rgba(41,22,5,.45); }
  dialog.f::backdrop { background: rgba(41,22,5,.4); }
  .dlg { display: grid; grid-template-rows: auto minmax(0, 1fr) auto; max-height: 88dvh; }
  .dlg header, .dlg footer { padding: 14px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; }
  .dlg header { border-bottom: 1px solid var(--rule); }
  .dlg header h2 { margin: 0; font: 400 28px var(--serif); }
  .dlg footer { border-top: 1px solid var(--rule); }
  .dlg .body { overflow-y: auto; padding: 0 20px 12px; }
  /* The header and footer already have rules, so the first and last groups don't need their own */
  .dlg .body details:first-child { border-top: 0; }
  .dlg .body details:last-child { border-bottom: 0; }
  .xb { width: 44px; height: 44px; border: 0; background: none; border-radius: 50%; cursor: pointer; display: grid; place-items: center; color: inherit; }
</style>

<body>
<div class="navwrap"><nav class="pillnav" aria-label="Main"><a class="logo" href="index.html">emu.</a><a class="l" href="index.html#how">How it works</a><a class="l" href="index.html#therapists">For therapists</a><a class="find" href="directory.html" aria-current="page">Find a therapist</a></nav></div>

      <form onsubmit="return false" role="search">
        <p class="sentence"><span class="lead">Therapists who meet</span> <span class="w w1">near</span> <span class="slot s1"><label for="loc" class="sr">City or ZIP code</label><input id="loc" value="Philadelphia, PA" autocomplete="address-level2"></span> <span class="w w2">within</span> <span class="slot dd s2" id="rad"><button type="button" aria-haspopup="listbox" aria-expanded="false" aria-label="Distance: 10 miles"><span>10 miles</span></button><span class="menu" role="listbox" aria-label="Distance" tabindex="-1" hidden></span></span></p>

<script>
  const { icon, placeIcon, excerpt, hints, moreLocs, exm } = KIT;
  const T = EMU.therapists, S = EMU.search, H = EMU.home;
  const href = t => t.example ? '#' : 'profile.html';
  document.getElementById('fopen').innerHTML = icon('sliders') + 'Filters';
  document.getElementById('v-list').innerHTML = icon('list') + 'List';
  document.getElementById('v-map').innerHTML = icon('map') + 'Map';
  document.getElementById('close').innerHTML = icon('x');

  // Custom menus: the native one is drawn at the field's own size, which is 52px in the sentence
  const makeDD = (root, opts, val, unit, label) => {
    const btn = root.querySelector('button'), list = root.querySelector('.menu'), id = root.id;
    let act = opts.indexOf(val);
    btn.insertAdjacentHTML('beforeend', '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>');
    const paint = () => {
      list.innerHTML = opts.map((o, i) => `<span role="option" id="${id}-${o}" aria-selected="${o === val}" class="${i === act ? 'act' : ''}" data-v="${o}">${icon('check')}${o}${unit}</span>`).join('');
      list.setAttribute('aria-activedescendant', `${id}-${opts[act]}`);
      btn.firstElementChild.textContent = val + unit; btn.setAttribute('aria-label', `${label}: ${val}${unit}`);
    };
    const open = () => { act = opts.indexOf(val); paint(); list.hidden = false; btn.setAttribute('aria-expanded', 'true'); list.focus(); };
    const close = (refocus = true) => { list.hidden = true; btn.setAttribute('aria-expanded', 'false'); if (refocus) btn.focus(); };
    const set = v => { val = v; paint(); };
    btn.onclick = () => list.hidden ? open() : close();
    list.onclick = e => { const li = e.target.closest('[role=option]'); if (li) { set(li.dataset.v); close(); } };
    list.onkeydown = e => {
      if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); act = (act + (e.key === 'ArrowDown' ? 1 : opts.length - 1)) % opts.length; paint(); }
      else if (e.key === 'Home' || e.key === 'End') { e.preventDefault(); act = e.key === 'Home' ? 0 : opts.length - 1; paint(); }
      else if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); set(opts[act]); close(); }
      else if (e.key === 'Escape') { e.preventDefault(); close(); }
      else if (e.key === 'Tab') close(false);
    };
    document.addEventListener('click', e => { if (!list.hidden && !root.contains(e.target)) close(false); });
    paint();
    return { set };
  };
  const RAD = makeDD(document.getElementById('rad'), ['5', '10', '25', '50'], '10', ' miles', 'Distance');
  makeDD(document.getElementById('pp'), ['10', '20', '50'], '10', '', 'Results per page');

  // Pagination: visual reference only, the mockup has one page of results
  const pg = document.getElementById('pages');
  const pager = cur => {
    pg.innerHTML = `<button type="button" class="pn" data-p="${cur - 1}" ${cur === 1 ? 'disabled' : ''}>${icon('left')}Previous</button>
      ${[1, 2, 3].map(n => `<button type="button" class="pnum" data-p="${n}" ${n === cur ? 'aria-current="page"' : ''} aria-label="Page ${n}">${n}</button>`).join('')}
      <button type="button" class="pn" data-p="${cur + 1}" ${cur === 3 ? 'disabled' : ''}>Next${icon('right')}</button>`;
  };
  pager(1);
  pg.onclick = e => { const b = e.target.closest('[data-p]'); if (b && !b.disabled) pager(+b.dataset.p); };

  // Filters: one state, shown in the sidebar (list view, wide screens) and in a dialog (map view and phones)
  const def = g => g[1].find(x => S.activeFilters.includes(x)) || g[1][0];
  const state = Object.fromEntries(EMU.filters.map(g => [g[0], def(g)]));
  const groupsHTML = () => EMU.filters.map(([n, o]) => `<details ${state[n] !== o[0] ? 'open' : ''}><summary>${n}</summary><div class="opts">${o.map(x => `<button type="button" class="opt" data-g="${n}" aria-pressed="${x === state[n]}"><span class="box">${icon('check')}</span>${x}</button>`).join('')}</div></details>`).join('');
  const render = () => {
    ['groups', 'groups2'].forEach(id => { const el = document.getElementById(id); const open = [...el.querySelectorAll('details')].map(d => d.open); el.innerHTML = groupsHTML(); el.querySelectorAll('details').forEach((d, i) => { if (open[i]) d.open = true; }); });
    const chipsHTML = EMU.filters.filter(g => state[g[0]] !== g[1][0]).map(g => `<button type="button" class="chip" data-g="${g[0]}" aria-label="Remove filter: ${state[g[0]]}">${state[g[0]]}${icon('x')}</button>`).join(' ');
    document.querySelectorAll('.chips').forEach(el => el.innerHTML = chipsHTML);
    const any = EMU.filters.some(g => state[g[0]] !== g[1][0]);
    document.querySelectorAll('.clr').forEach(b => b.hidden = !any);
  };
  render();
  document.addEventListener('click', e => {
    const b = e.target.closest('.opt'); if (b) { state[b.dataset.g] = b.textContent.trim(); render(); return; }
    const clr = e.target.closest('.clr');
    if (clr) { EMU.filters.forEach(g => state[g[0]] = g[1][0]); render(); (clr.closest('dialog') ? document.getElementById('show') : document.querySelector('.filters summary')).focus(); return; }
    const c = e.target.closest('.chip'); if (c) { state[c.dataset.g] = EMU.filters.find(g => g[0] === c.dataset.g)[1][0]; render(); }
  });
  const dlg = document.getElementById('dlg');
  document.getElementById('fopen').onclick = () => dlg.showModal();
  document.getElementById('close').onclick = document.getElementById('show').onclick = () => dlg.close();

  // List rows (concept 1)
  document.getElementById('results').innerHTML = T.map(p => `
    <li class="row rv">
      <div class="place"><span class="where">${icon(placeIcon(p.placeType))}${p.place}</span>${p.id === 'jordan' ? `<span class="sub">${moreLocs().replace(' and ', 'And ')}</span>` : ''}<span class="sub">${p.placeType}, ${p.distance} away</span></div>
      <div class="person"><img src="${p.photo}" alt="Portrait of ${p.name}"><div>
        <h2 class="name"><a href="${href(p)}">${p.name}</a>${p.example ? '<span class="example">Example</span>' : ''}</h2>
        <p class="cred">${p.credential}</p><span class="verified">${icon('badge')}License verified in ${p.state}</span>
        ${excerpt(p)}
        <p class="spec">Helps with <b>${p.specialties.slice(0, 3).join(', ').replace(/, ([^,]*)$/, ' and $1')}</b></p><div class="x-hints">${hints(p.id)}</div></div></div>
      <div class="tail"><span><span class="price">$${p.price}</span> <span class="per">per session</span></span><span class="next">Next opening ${p.next}</span><span class="go" aria-hidden="true">View profile ${icon('right')}</span></div>
    </li>`).join('');

  // Map view: full screen, the list follows the map
  document.getElementById('mpanel').innerHTML = `<div class="msearch"></div><div class="mfil"><button type="button" class="fbtn" data-filters>${icon('sliders')}Filters</button><span class="chips"></span></div><p class="x-mapcount" aria-live="polite"></p><ol class="mlist">${T.map((t, i) => `
    <li data-pin="${i + 1}"><span class="n" aria-hidden="true">${i + 1}</span>
      <div class="mc-top"><img src="${t.photo}" alt=""><div class="mc-id"><span class="nm"><a href="${href(t)}">${t.name}</a></span><span class="cr">${t.credential}</span><span class="verified">${icon('badge')}License verified in ${t.state}</span></div><span class="pr">$${t.price}<small>per session</small></span></div>
      <div class="mc-body">
        <span class="pl">${icon(placeIcon(t.placeType))}<span>${t.place}<small>${t.placeType}, ${t.distance} away${t.id === 'jordan' ? `. ${moreLocs().trim().replace(/^and /, 'Also ')}` : ''}</small></span></span>
        <div class="mc-more" id="mc-${i + 1}"><div inert>
          ${excerpt(t)}
          <p class="spec">Helps with <b>${t.specialties.slice(0, 3).join(', ').replace(/, ([^,]*)$/, ' and $1')}</b></p>
          <div class="x-hints">${hints(t.id)}</div>
        </div></div>
        <div class="next"><span>Next opening ${t.next}</span><button type="button" class="mc-tog" aria-expanded="false" aria-controls="mc-${i + 1}"><span>More</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg></button></div>
      </div></li>`).join('')}</ol>`;
  render();
  // The List/Map toggle and the search sentence are the same components in both views: they move into the map layer and back
  const viewEl = document.querySelector('.bar .view'), viewHome = viewEl.nextSibling, viewParent = viewEl.parentNode;
  const formEl = document.querySelector('.lede form'), formHome = formEl.nextSibling, formParent = formEl.parentNode;
  const bg = [document.querySelector('.navwrap'), document.getElementById('main'), document.querySelector('footer.end')];
  // Toggle animation: a pine thumb slides to the chosen button, then the map grows out of the Map button (and shrinks back into the toggle)
  const thumb = document.createElement('span'); thumb.className = 'thumb'; thumb.setAttribute('aria-hidden', 'true'); viewEl.prepend(thumb);
  const placeThumb = instant => {
    const b = viewEl.querySelector('button[aria-pressed="true"]');
    if (instant) thumb.classList.add('nomo');
    thumb.style.width = b.offsetWidth + 'px'; thumb.style.transform = `translateX(${b.offsetLeft}px)`;
    if (instant) { thumb.offsetWidth; thumb.classList.remove('nomo'); }
  };
  placeThumb(true);
  const press = map => { document.getElementById('v-list').setAttribute('aria-pressed', !map); document.getElementById('v-map').setAttribute('aria-pressed', map); placeThumb(); };
  const applyView = map => {
    document.getElementById('mapview').hidden = !map;
    document.body.classList.toggle('mapmode', map);
    document.documentElement.classList.toggle('maplock', map);
    bg.forEach(el => el.inert = map);
    if (map) { document.getElementById('mview').appendChild(viewEl); document.querySelector('.msearch').appendChild(formEl); KIT.mountDirMap(document.getElementById('dirmap'), document.getElementById('mpanel'), href, { tiles: 'streets', bubble: true }); }
    else { viewParent.insertBefore(viewEl, viewHome); formParent.insertBefore(formEl, formHome); }
    placeThumb(true);
    document.getElementById(map ? 'v-map' : 'v-list').focus({ preventScroll: true });
  };
  let busy = false;
  const setView = async map => {
    if (busy || document.body.classList.contains('mapmode') === map) return;
    busy = true;
    press(map);
    if (MOTION.reduce) { applyView(map); busy = false; return; }
    await new Promise(r => setTimeout(r, 220));
    const r = (map ? document.getElementById('v-map') : viewEl).getBoundingClientRect();
    const at = `at ${r.left + r.width / 2}px ${r.top + r.height / 2}px`, open = `circle(150% ${at})`, shut = `circle(0px ${at})`;
    const st = document.getElementById('mapview');
    if (map) { applyView(true); await st.animate({ clipPath: [shut, open] }, { duration: 520, easing: 'cubic-bezier(.3,.7,.2,1)' }).finished; }
    else { await st.animate({ clipPath: [open, shut] }, { duration: 380, easing: 'cubic-bezier(.55,0,.75,.2)' }).finished; applyView(false); }
    busy = false;
  };
  document.getElementById('v-list').onclick = () => setView(false);
  document.getElementById('v-map').onclick = () => setView(true);
  document.getElementById('mpanel').addEventListener('click', e => {
    const tg = e.target.closest('.mc-tog'); if (!tg) return;
    const open = tg.getAttribute('aria-expanded') !== 'true'; tg.setAttribute('aria-expanded', open); tg.firstElementChild.textContent = open ? 'Less' : 'More';
    const mo = document.getElementById(tg.getAttribute('aria-controls')); mo.classList.toggle('open', open); mo.firstElementChild.inert = !open;
  });
  document.querySelector('.mfil [data-filters]').onclick = () => dlg.showModal();
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && document.body.classList.contains('mapmode') && !dlg.open && !document.querySelector('.leaflet-popup')) setView(false); });

  document.getElementById('foot').innerHTML = `
    <div><a class="logo" href="index.html">emu.</a><nav aria-label="Footer"><a href="directory.html">Find a therapist</a><a href="#">About Emu</a><a href="index.html#therapists">For therapists</a><a href="#">Contact</a><a href="#">Privacy</a><a href="#">Terms</a></nav></div>
    <div><p>${H.disclaimer}</p><p class="crisis">${H.crisis}</p></div>`;
  MOTION.watch();
</script>
</body>
</html>
